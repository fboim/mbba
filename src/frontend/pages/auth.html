<!DOCTYPE html>
<html lang="id" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — MBBA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Montserrat', 'sans-serif'],
            arabic: ['Amiri', 'serif'],
          }
        }
      }
    }
  </script>
  <style>
    .arabic-hero {
      font-family: 'Amiri', serif;
      direction: rtl;
      line-height: 2.5;
    }
  </style>
</head>
<body class="bg-slate-50 font-sans min-h-screen flex">

  <!-- LEFT: Branding (desktop only) -->
  <div class="hidden lg:flex lg:w-1/2 bg-gradient-to-br from-primary-600 to-primary-800 flex-col items-center justify-center px-12 text-white relative overflow-hidden">
    <!-- Decorative circle -->
    <div class="absolute -top-20 -left-20 w-72 h-72 bg-white/10 rounded-full"></div>
    <div class="absolute -bottom-20 -right-20 w-96 h-96 bg-white/5 rounded-full"></div>

    <div class="relative z-10 text-center">
      <div class="w-20 h-20 bg-white/20 rounded-2xl flex items-center justify-center mx-auto mb-8 backdrop-blur">
        <span class="text-white font-bold text-4xl">م</span>
      </div>
      <h1 class="text-4xl font-bold mb-2">MBBA</h1>
      <p class="text-primary-100 text-lg mb-8">Madrasah Belajar Bahasa Arab</p>
      <div class="arabic-hero text-2xl text-primary-100 mb-8">
        اَلسَّلاَمُ عَلَيْكُمْ وَرَحْمَةُ اللهِ وَبَرَكَاتُهُ
      </div>
      <p class="text-primary-200 text-sm max-w-xs mx-auto">
        Belajar nahwu dan shorof menggunakan Kitab Mukhtarat dengan metode yang terstruktur dan mudah dipahami.
      </p>
    </div>
  </div>

  <!-- RIGHT: Auth Form -->
  <div class="w-full lg:w-1/2 flex items-center justify-center px-6 py-12">
    <div class="w-full max-w-md">

      <!-- Mobile Logo -->
      <div class="lg:hidden flex items-center gap-3 mb-8 justify-center">
        <div class="w-10 h-10 bg-primary-600 rounded-xl flex items-center justify-center">
          <span class="text-white font-bold text-lg">م</span>
        </div>
        <span class="font-bold text-slate-800 text-xl">MBBA</span>
      </div>

      <!-- Tab Toggle -->
      <div class="flex bg-slate-100 rounded-xl p-1 mb-8">
        <button id="tabLogin" onclick="switchTab('login')"
          class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition bg-white text-slate-800 shadow-sm">
          Masuk
        </button>
        <button id="tabRegister" onclick="switchTab('register')"
          class="flex-1 py-2.5 rounded-lg text-sm font-semibold transition text-slate-500">
          Daftar
        </button>
      </div>

      <!-- Login Form -->
      <form id="formLogin" onsubmit="handleLogin(event)">
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
            <div class="relative">
              <i class="fa-solid fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
              <input type="email" id="loginEmail" required
                class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition"
                placeholder="nama@email.com">
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
            <div class="relative">
              <i class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
              <input type="password" id="loginPassword" required
                class="w-full pl-10 pr-12 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition"
                placeholder="Minimal 6 karakter">
              <button type="button" onclick="togglePassword('loginPassword', this)"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-eye text-sm"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- Error message -->
        <div id="loginError" class="hidden mt-3 p-3 bg-red-50 border border-red-200 rounded-xl text-red-700 text-sm"></div>

        <button type="submit" id="loginBtn"
          class="w-full mt-6 py-3 bg-primary-600 hover:bg-primary-700 text-white font-semibold rounded-xl transition shadow-sm flex items-center justify-center gap-2">
          <span>Masuk</span>
          <i class="fa-solid fa-arrow-right text-sm"></i>
        </button>
      </form>

      <!-- Register Form -->
      <form id="formRegister" onsubmit="handleRegister(event)" class="hidden">
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap</label>
            <div class="relative">
              <i class="fa-solid fa-user absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
              <input type="text" id="regName" required
                class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition"
                placeholder="Abdullah Rahman">
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
            <div class="relative">
              <i class="fa-solid fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
              <input type="email" id="regEmail" required
                class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition"
                placeholder="nama@email.com">
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
            <div class="relative">
              <i class="fa-solid fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
              <input type="password" id="regPassword" required minlength="6"
                class="w-full pl-10 pr-12 py-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition"
                placeholder="Minimal 6 karakter">
              <button type="button" onclick="togglePassword('regPassword', this)"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-eye text-sm"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- Error message -->
        <div id="regError" class="hidden mt-3 p-3 bg-red-50 border border-red-200 rounded-xl text-red-700 text-sm"></div>

        <button type="submit" id="regBtn"
          class="w-full mt-6 py-3 bg-primary-600 hover:bg-primary-700 text-white font-semibold rounded-xl transition shadow-sm flex items-center justify-center gap-2">
          <span>Daftar Sekarang</span>
          <i class="fa-solid fa-user-plus text-sm"></i>
        </button>
      </form>

      <p class="text-center text-sm text-slate-400 mt-6">
        Lupa password? Hubungi admin.
      </p>
    </div>
  </div>

  <!-- Supabase Auth Script -->
  <script src="../js/api.js"></script>
  <script>
    // ═══════════════════════════════════════
    // TAB SWITCH
    // ═══════════════════════════════════════
    function switchTab(tab) {
      const formLogin = document.getElementById('formLogin');
      const formRegister = document.getElementById('formRegister');
      const tabLogin = document.getElementById('tabLogin');
      const tabRegister = document.getElementById('tabRegister');
      const loginError = document.getElementById('loginError');
      const regError = document.getElementById('regError');

      loginError.classList.add('hidden');
      regError.classList.add('hidden');

      if (tab === 'login') {
        formLogin.classList.remove('hidden');
        formRegister.classList.add('hidden');
        tabLogin.classList.add('bg-white', 'text-slate-800', 'shadow-sm');
        tabLogin.classList.remove('text-slate-500');
        tabRegister.classList.remove('bg-white', 'text-slate-800', 'shadow-sm');
        tabRegister.classList.add('text-slate-500');
      } else {
        formLogin.classList.add('hidden');
        formRegister.classList.remove('hidden');
        tabRegister.classList.add('bg-white', 'text-slate-800', 'shadow-sm');
        tabRegister.classList.remove('text-slate-500');
        tabLogin.classList.remove('bg-white', 'text-slate-800', 'shadow-sm');
        tabLogin.classList.add('text-slate-500');
      }
    }

    // ═══════════════════════════════════════
    // TOGGLE PASSWORD VISIBILITY
    // ═══════════════════════════════════════
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    // ═══════════════════════════════════════
    // LOGIN
    // ═══════════════════════════════════════
    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const errorEl = document.getElementById('loginError');
      const btn = document.getElementById('loginBtn');

      errorEl.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-sm"></i> <span>Memuat...</span>';

      try {
        const data = await login(email, password);
        // Redirect ke fasal.html setelah login berhasil
        window.location.href = 'fasal.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = '<span>Masuk</span><i class="fa-solid fa-arrow-right text-sm"></i>';
      }
    }

    // ═══════════════════════════════════════
    // REGISTER
    // ═══════════════════════════════════════
    async function handleRegister(e) {
      e.preventDefault();
      const fullName = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;
      const errorEl = document.getElementById('regError');
      const btn = document.getElementById('regBtn');

      errorEl.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-sm"></i> <span>Memuat...</span>';

      try {
        await register(email, password, fullName);
        // Langsung login setelah registrasi
        const data = await login(email, password);
        window.location.href = 'fasal.html';
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = '<span>Daftar Sekarang</span><i class="fa-solid fa-user-plus text-sm"></i>';
      }
    }

    // ═══════════════════════════════════════
    // AUTO LOGIN IF TOKEN EXISTS
    // ═══════════════════════════════════════
    (async function() {
      const user = await getCurrentUser();
      if (user) {
        window.location.href = 'fasal.html';
      }
    })();
  </script>
</body>
</html>
