<!DOCTYPE html>
<html lang="id" dir="ltr">
<head>

      font-family: 'Amiri', serif;
      direction: rtl;
      text-align: right;
      line-height: 2.2;

<body class="bg-slate-50 font-sans min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-50">
    <div class="max-w-2xl mx-auto px-4 md:px-6 h-14 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="student.html" class="p-2 rounded-lg hover:bg-slate-100 text-slate-500">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 bg-primary-600 rounded-lg flex items-center justify-center">
            <span class="text-white font-bold text-sm">م</span>
          </div>
          <span class="font-bold text-slate-800">MBBA</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-2xl mx-auto px-4 md:px-6 py-6">

    <!-- Profile Header -->
    <div class="bg-white rounded-xl border border-slate-200 p-6 mb-6">
      <div class="flex items-center gap-4 mb-6">
        <div class="w-20 h-20 bg-primary-100 rounded-full flex items-center justify-center">
          <span id="avatarInitial" class="text-3xl font-bold text-primary-600">P</span>
        </div>
        <div>
          <h1 id="profileName" class="text-xl font-bold text-slate-800">Memuat...</h1>
          <p id="profileEmail" class="text-slate-500">email@example.com</p>
          <span id="profileRole" class="inline-block mt-2 px-3 py-1 bg-primary-100 text-primary-700 text-xs font-semibold rounded-full">Pelajar</span>
        </div>
      </div>

      <div class="grid grid-cols-3 gap-4 text-center">
        <div class="p-4 bg-slate-50 rounded-lg">
          <div id="statCompleted" class="text-2xl font-bold text-green-600">0</div>
          <div class="text-sm text-slate-500">Fasal Selesai</div>
        </div>
        <div class="p-4 bg-slate-50 rounded-lg">
          <div id="statAvgScore" class="text-2xl font-bold text-blue-600">0%</div>
          <div class="text-sm text-slate-500">Rata-rata</div>
        </div>
        <div class="p-4 bg-slate-50 rounded-lg">
          <div id="statStreak" class="text-2xl font-bold text-amber-500">0</div>
          <div class="text-sm text-slate-500">Streak Hari</div>
        </div>
      </div>
    </div>

    <!-- Quick Actions -->
    <div class="bg-white rounded-xl border border-slate-200 p-6 mb-6">
      <h2 class="text-lg font-semibold text-slate-800 mb-4">
        <i class="fa-solid fa-bolt text-primary-500 mr-2"></i>
        Aksi Cepat
      </h2>
      <div class="grid grid-cols-2 gap-3">
        <a href="student.html" class="flex items-center gap-3 p-4 bg-slate-50 hover:bg-slate-100 rounded-lg transition">
          <div class="w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center">
            <i class="fa-solid fa-home text-blue-600"></i>
          </div>
          <div>
            <div class="font-semibold text-slate-800">Dashboard</div>
            <div class="text-xs text-slate-500">Lihat progreso</div>
          </div>
        </a>
        <a href="fasal.html" class="flex items-center gap-3 p-4 bg-slate-50 hover:bg-slate-100 rounded-lg transition">
          <div class="w-10 h-10 bg-green-100 rounded-lg flex items-center justify-center">
            <i class="fa-solid fa-book text-green-600"></i>
          </div>
          <div>
            <div class="font-semibold text-slate-800">Daftar Fasal</div>
            <div class="text-xs text-slate-500">Lihat semua materi</div>
          </div>
        </a>
        <a href="materi.html" class="flex items-center gap-3 p-4 bg-slate-50 hover:bg-slate-100 rounded-lg transition">
          <div class="w-10 h-10 bg-purple-100 rounded-lg flex items-center justify-center">
            <i class="fa-solid fa-graduation-cap text-purple-600"></i>
          </div>
          <div>
            <div class="font-semibold text-slate-800">Materi</div>
            <div class="text-xs text-slate-500">Belajar kontent</div>
          </div>
        </a>
        <button onclick="confirmLogout()" class="flex items-center gap-3 p-4 bg-red-50 hover:bg-red-100 rounded-lg transition text-left">
          <div class="w-10 h-10 bg-red-100 rounded-lg flex items-center justify-center">
            <i class="fa-solid fa-sign-out-alt text-red-600"></i>
          </div>
          <div>
            <div class="font-semibold text-red-700">Keluar</div>
            <div class="text-xs text-red-400">Logout dari aplikasi</div>
          </div>
        </button>
      </div>
    </div>

    <!-- Achievements -->
    <div class="bg-white rounded-xl border border-slate-200 p-6 mb-6">
      <h2 class="text-lg font-semibold text-slate-800 mb-4">
        <i class="fa-solid fa-trophy text-amber-500 mr-2"></i>
        Pencapaian
      </h2>
      <div id="achievements" class="space-y-3">
        <!-- Achievements will be loaded here -->
      </div>
    </div>

    <!-- Settings -->
    <div class="bg-white rounded-xl border border-slate-200 p-6">
      <h2 class="text-lg font-semibold text-slate-800 mb-4">
        <i class="fa-solid fa-cog text-slate-500 mr-2"></i>
        Pengaturan
      </h2>
      <div class="space-y-3">
        <div class="flex items-center justify-between p-3 bg-slate-50 rounded-lg">
          <div class="flex items-center gap-3">
            <i class="fa-solid fa-moon text-slate-400"></i>
            <span class="text-slate-700">Mode Gelap</span>
          </div>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="darkModeToggle" class="sr-only peer">
            <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-600"></div>
          </label>
        </div>
        <div class="flex items-center justify-between p-3 bg-slate-50 rounded-lg">
          <div class="flex items-center gap-3">
            <i class="fa-solid fa-language text-slate-400"></i>
            <span class="text-slate-700">Bahasa</span>
          </div>
          <select class="px-3 py-1.5 border border-slate-200 rounded-lg text-sm">
            <option value="id">Indonesia</option>
            <option value="ar">العربية</option>
            <option value="en">English</option>
          </select>
        </div>
        <div class="flex items-center justify-between p-3 bg-slate-50 rounded-lg">
          <div class="flex items-center gap-3">
            <i class="fa-solid fa-bell text-slate-400"></i>
            <span class="text-slate-700">Notifikasi</span>
          </div>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" class="sr-only peer" checked>
            <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-600"></div>
          </label>
        </div>
      </div>
    </div>

    <!-- App Info -->
    <div class="mt-6 text-center text-xs text-slate-400">
      <p>MBBA v1.0 — Madrasah Belajar Bahasa Arab</p>
      <p class="mt-1">Kitab Mukhtarat</p>
    </div>

  </main>

  <script src="../js/api.js"></script>
  <script>
    let userProgress = [];

    // Check login and load profile
    (async function() {
      const user = await getCurrentUser();
      if (!user) {
        window.location.href = 'auth.html';
        return;
      }

      // Load profile data
      loadProfile(user);
      await loadProgress();
    })();

    function loadProfile(user) {
      const name = user.user_metadata?.full_name || user.email || 'Pelajar';
      const email = user.email || '';
      const role = user.user_metadata?.role || 'student';

      document.getElementById('profileName').textContent = name;
      document.getElementById('profileEmail').textContent = email;
      document.getElementById('avatarInitial').textContent = name.charAt(0).toUpperCase();

      const roleLabel = role === 'admin' ? 'Admin' : role === 'teacher' ? 'Guru' : 'Pelajar';
      document.getElementById('profileRole').textContent = roleLabel;
    }

    async function loadProgress() {
      try {
        userProgress = await fetchUserProgress();

        // Update stats
        const completed = userProgress.filter(p => p.status === 'completed').length;
        const avgScore = userProgress.length > 0
          ? Math.round(userProgress.reduce((sum, p) => sum + (p.quiz_score || 0), 0) / userProgress.length)
          : 0;

        document.getElementById('statCompleted').textContent = completed;
        document.getElementById('statAvgScore').textContent = avgScore + '%';

        // Calculate streak
        const streak = calculateStreak();
        document.getElementById('statStreak').textContent = streak;

        // Update achievements
        renderAchievements(completed, avgScore);
      } catch (err) {
        console.error('Error loading progress:', err);
      }
    }

    function calculateStreak() {
      if (userProgress.length === 0) return 0;

      const dates = userProgress
        .map(p => new Date(p.completed_at || p.created_at).toDateString())
        .filter(d => d !== 'Invalid Date');
      const uniqueDates = [...new Set(dates)].sort((a, b) => new Date(b) - new Date(a));

      if (uniqueDates.length === 0) return 0;

      const today = new Date().toDateString();
      const yesterday = new Date(Date.now() - 86400000).toDateString();

      if (uniqueDates[0] !== today && uniqueDates[0] !== yesterday) return 0;

      let streak = 1;
      for (let i = 1; i < uniqueDates.length; i++) {
        const diff = (new Date(uniqueDates[i-1]) - new Date(uniqueDates[i])) / 86400000;
        if (diff === 1) {
          streak++;
        } else {
          break;
        }
      }
      return streak;
    }

    function renderAchievements(completed, avgScore) {
      const container = document.getElementById('achievements');
      const achievements = [
        { id: 'first', label: '1 Fasal Pertama', icon: 'fa-star', condition: completed >= 1, color: 'amber' },
        { id: 'five', label: '5 Fasal Selesai', icon: 'fa-fire', condition: completed >= 5, color: 'orange' },
        { id: 'perfect', label: 'Skor Sempurna 100%', icon: 'fa-crown', condition: avgScore === 100, color: 'yellow' },
        { id: 'streak7', label: '7 Hari Streak', icon: 'fa-calendar-check', condition: calculateStreak() >= 7, color: 'green' },
        { id: 'ten', label: '10 Fasal Selesai', icon: 'fa-trophy', condition: completed >= 10, color: 'purple' },
        { id: 'all', label: 'Semua Fasal Selesai', icon: 'fa-medal', condition: false, color: 'primary' },
      ];

      container.innerHTML = achievements.map(a => `
        <div class="flex items-center gap-3 p-3 rounded-lg ${a.condition ? 'bg-amber-50 border border-amber-200' : 'bg-slate-50'}">
          <div class="w-10 h-10 rounded-full flex items-center justify-center ${a.condition ? 'bg-amber-100' : 'bg-slate-100'}">
            <i class="fa-solid ${a.icon} ${a.condition ? 'text-amber-500' : 'text-slate-400'}"></i>
          </div>
          <div class="flex-1">
            <div class="font-medium ${a.condition ? 'text-amber-700' : 'text-slate-500'}">${a.label}</div>
            <div class="text-xs ${a.condition ? 'text-amber-500' : 'text-slate-400'}">
              ${a.condition ? 'Tercapai!' : 'Belum tercapai'}
            </div>
          </div>
          ${a.condition ? '<i class="fa-solid fa-check-circle text-amber-500"></i>' : '<i class="fa-regular fa-circle text-slate-300"></i>'}
        </div>
      `).join('');
    }

    function confirmLogout() {
      if (confirm('Yakin ingin keluar?')) {
        logout();
        window.location.href = 'auth.html';
      }
    }
  </script>
</body>
</html>
