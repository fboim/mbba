<!DOCTYPE html>
<html lang="id" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBBA — Belajar Bahasa Arab</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome (icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Montserrat', 'sans-serif'],
            arabic: ['Amiri', 'serif'],
          },
          colors: {
            primary: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' },
            accent:  { 500: '#f59e0b', 600: '#d97706' },
            dark:    { 800: '#1e293b', 900: '#0f172a' },
          }
        }
      }
    }
  </script>

  <style>
    /* Arabic text styling */
    .arabic-text {
      font-family: 'Amiri', serif;
      direction: rtl;
      text-align: right;
      line-height: 2.2;
      font-size: 1.4rem;
    }
    .arabic-text .harakat { font-size: 0.85em; }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Audio player */
    audio { width: 100%; border-radius: 0.5rem; }
    audio::-webkit-media-controls-panel { background: #f0fdf4; }

    /* Locked item */
    .sidebar-item.locked { opacity: 0.45; cursor: not-allowed; }
    .sidebar-item.unlocked { border-left: 3px solid #22c55e; background: #f0fdf4; }
    .sidebar-item.active { background: #dcfce7; font-weight: 600; }
    .sidebar-item.completed { border-left: 3px solid #16a34a; background: #dcfce7; }

    /* Quiz option */
    .quiz-option { cursor: pointer; transition: all 0.2s; }
    .quiz-option:hover { border-color: #22c55e; background: #f0fdf4; }
    .quiz-option.selected { border-color: #22c55e; background: #dcfce7; }
    .quiz-option.correct { border-color: #16a34a; background: #dcfce7; color: #15803d; }
    .quiz-option.wrong { border-color: #ef4444; background: #fef2f2; color: #b91c1c; }

    /* Drawer animation */
    .drawer { transition: transform 0.3s ease; }
    .drawer.open { transform: translateX(0); }
  </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen">

  <!-- ═══════════════════════════════════════ -->
  <!-- LAYOUT: SHARED ACROSS ALL PAGES        -->
  <!-- ═══════════════════════════════════════ -->

  <!-- HEADER -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-white border-b border-slate-200 shadow-sm">

      <!-- Hamburger -->

          <span class="text-white font-bold text-sm">م</span>
        </div>
        <span class="font-bold text-slate-800 tracking-wide">MBBA</span>
      </div>

      <!-- Right side: progress + logout -->
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-2 text-sm text-slate-500">
          <i class="fa-solid fa-graduation-cap text-primary-600"></i>
          <span id="progressText">Bagian 1 — Bab 1</span>
        </div>
        <button onclick="handleLogout()" title="Keluar"

          <i class="fa-solid fa-right-from-bracket text-sm"></i>

      </div>
    </div>
  </header>

  <!-- SIDEBAR / DRAWER -->
  <aside id="sidebar" class="drawer fixed top-14 left-0 bottom-0 w-72 bg-white border-r border-slate-200 overflow-y-auto z-40

      </div>

  </main>

    // ═══════════════════════════════════════
    // STATE
    // ═══════════════════════════════════════

    let kurikulumData = [];          // loaded from fetchKurikulum()
    let progressMap = {};           // {fasalId: progressObj} from fetchUserProgress()
    let currentFasalId = null;
    let currentFasal = null;
    let currentSessionQuestions = [];  // 10 soal acak per sesi
    let selectedAnswers = {};

    // ═══════════════════════════════════════
    // RENDER KURIKULUM SIDEBAR
    // ═══════════════════════════════════════
    function renderSidebar() {
      const nav = document.getElementById('sidebarNav');
      nav.innerHTML = '';

      kurikulumData.forEach((bagian, bi) => {
        bagian.bab.forEach((bab, bai) => {
          // Bab header
          const babDiv = document.createElement('div');
          babDiv.className = 'mt-2';
          babDiv.innerHTML = `
            <div class="px-3 py-2 text-xs font-bold text-slate-500 uppercase tracking-wider">
              ${bab.is_muqoddimah ? '🟢 ' : ''}${bab.title}
            </div>
          `;
          nav.appendChild(babDiv);

          // Fasal list
          (bab.fasal || []).forEach(fasal => {
            const prog = progressMap[fasal.id] || { status: 'locked' };
            const statusClass = prog.status === 'completed' ? 'completed'
                              : prog.status === 'unlocked' ? 'unlocked'
                              : prog.status === 'in_progress' ? 'unlocked'
                              : 'locked';
            const icon = prog.status === 'completed' ? 'fa-check-circle text-primary-600'
                       : prog.status === 'unlocked' ? 'fa-unlock text-accent-500'
                       : prog.status === 'in_progress' ? 'fa-unlock text-accent-500'
                       : 'fa-lock text-slate-400';
            const isActive = fasal.id === currentFasalId;

            const item = document.createElement('div');
            item.className = `sidebar-item ${statusClass} ${isActive ? 'active' : ''} px-3 py-2 rounded-lg flex items-center gap-2 cursor-pointer hover:bg-slate-50`;
            item.innerHTML = `
              <i class="fa-solid ${icon} text-xs"></i>
              <span class="flex-1 text-slate-700 text-xs">${fasal.title}</span>
            `;
            if (prog.status !== 'locked') {
              item.onclick = () => loadFasal(fasal.id);
            }
            nav.appendChild(item);
          });
        });
      });
    }

    // ═══════════════════════════════════════
    // LOAD FASAL
    // ═══════════════════════════════════════
    async function loadFasal(fasalId) {
      currentFasalId = fasalId;
      quizSubmitted = false;
      selectedAnswers = {};

      // Show loading in content area
      document.getElementById('contentArab').innerHTML = '<p class="text-slate-400 italic">Memuat...</p>';
      document.getElementById('contentId').textContent = 'Memuat...';

      // Find fasal in kurikulum data
      let found = null;
      outer: for (const bagian of kurikulumData) {
        for (const bab of (bagian.bab || [])) {
          for (const fasal of (bab.fasal || [])) {
            if (fasal.id === fasalId) {
              found = fasal;
              break outer;
            }
          }
        }
      }

      if (!found) {
        console.error('Fasal tidak ditemukan:', fasalId);
        return;
      }
      currentFasal = found;

      // Update breadcrumb
      document.getElementById('breadcrumb').innerHTML = `
        <span>Bagian 1</span>
        <i class="fa-solid fa-chevron-right text-[10px]"></i>
        <span>Muqoddimah</span>
        <i class="fa-solid fa-chevron-right text-[10px]"></i>
        <span class="text-slate-600 font-medium">${found.title}</span>
      `;

      // Update title
      document.getElementById('fasalTitle').textContent = found.title;
      document.getElementById('progressText').textContent = found.title;

      // Render content from kurikulum
      document.getElementById('contentArab').innerHTML = found.content_arab;
      document.getElementById('contentId').textContent = found.content_id;

      // Audio
      const audioSection = document.getElementById('audioSection');
      const audioSource = document.getElementById('audioSource');
      if (found.audio_url) {
        audioSection.classList.remove('hidden');
        audioSource.src = found.audio_url;
        document.getElementById('audioPlayer').load();
      } else {
        audioSection.classList.add('hidden');
      }

      // Fetch quiz bank from API
      let quizBank = [];
      try {
        quizBank = await fetchQuizBank(fasalId);
      } catch (err) {
        console.error('Gagal mengambil bank soal, menggunakan fallback:', err);
        quizBank = DUMMY_QUIZ_BANK[fasalId] || [];
      }

      // Parse options from JSON string if needed
      quizBank = quizBank.map(q => ({
        ...q,
        options: typeof q.options === 'string' ? JSON.parse(q.options || '[]') : (q.options || []),
      }));

      // Use shuffleQuiz from quiz.js (exposes 10 random questions)
      currentSessionQuestions = shuffleQuiz(quizBank);
      renderQuiz(currentSessionQuestions);

      // Show done button if fasal is unlocked but no quiz
      document.getElementById('doneSection').classList.add('hidden');

      renderSidebar();
      updateProgressBar();
    }

    // ═══════════════════════════════════════
    // SHUFFLE ARRAY
    // ═══════════════════════════════════════
    function shuffleArray(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // ═══════════════════════════════════════
    // RENDER QUIZ (3 tipe soal)
    // ═══════════════════════════════════════
    function renderQuiz(questions) {
      const container = document.getElementById('quizContainer');
      container.innerHTML = '';
      document.getElementById('quizResult').classList.add('hidden');
      document.getElementById('quizActions').classList.remove('hidden');
      document.getElementById('submitQuizBtn').disabled = false;

      questions.forEach((q, qi) => {
        const qDiv = document.createElement('div');
        qDiv.className = 'mb-6';

        if (q.type === 'mc') {
          // Multiple Choice
          qDiv.innerHTML = `
            <p class="font-semibold text-slate-800 mb-3 text-sm">${qi + 1}. ${q.question}</p>
            <div class="space-y-2" data-question-id="${q.id}" data-type="mc">
              ${(q.options || []).map(opt => `
                <div class="quiz-option border-2 border-slate-200 rounded-lg px-4 py-3 text-sm cursor-pointer"
                     data-key="${opt.key}" onclick="selectAnswer('${q.id}','${opt.key}',this)">
                  <span class="font-bold mr-2">${opt.key}.</span> ${opt.value}
                </div>
              `).join('')}
            </div>
          `;
        } else if (q.type === 'fill-arab') {
          // Isian Arab
          qDiv.innerHTML = `
            <p class="font-semibold text-slate-800 mb-3 text-sm">${qi + 1}. ${q.question}</p>
            <div class="space-y-2" data-question-id="${q.id}" data-type="fill-arab">
              <input type="text" dir="rtl" lang="ar"
                class="w-full border-2 border-slate-200 rounded-lg px-4 py-3 text-sm arabic-text text-right"
                placeholder="${q.placeholder || 'ketik jawaban Arab...'}"
                oninput="setFillAnswer('${q.id}',this.value,'fill-arab')">
            </div>
          `;
        } else if (q.type === 'fill-latin') {
          // Isian Latin
          qDiv.innerHTML = `
            <p class="font-semibold text-slate-800 mb-3 text-sm">${qi + 1}. ${q.question}</p>
            <div class="space-y-2" data-question-id="${q.id}" data-type="fill-latin">
              <input type="text"
                class="w-full border-2 border-slate-200 rounded-lg px-4 py-3 text-sm"
                placeholder="${q.placeholder || 'ketik jawaban...'}"
                oninput="setFillAnswer('${q.id}',this.value,'fill-latin')">
            </div>
          `;
        }

        container.appendChild(qDiv);
      });
    }

    // ═══════════════════════════════════════
    // SELECT ANSWER (MC)
    // ═══════════════════════════════════════
    function selectAnswer(questionId, key, el) {
      if (quizSubmitted) return;
      const siblings = el.parentElement.querySelectorAll('.quiz-option');
      siblings.forEach(s => s.classList.remove('selected'));
      el.classList.add('selected');
      selectedAnswers[questionId] = key;
    }

    // ═══════════════════════════════════════
    // SET ANSWER (FILL)
    // ═══════════════════════════════════════
    function setFillAnswer(questionId, value, type) {
      if (quizSubmitted) return;
      selectedAnswers[questionId] = value;
    }

    // ═══════════════════════════════════════
    // ═══════════════════════════════════════
  // CHEAT — DEMO: auto answer all correctly
  // ═══════════════════════════════════════
  function cheatAnswerAll() {
    currentSessionQuestions.forEach(q => {
      selectedAnswers[q.id] = q.correct_answer;
      if (q.type === 'mc') {
        document.querySelectorAll(`[data-question-id="${q.id}"] .quiz-option`).forEach(opt => {
          opt.classList.remove('bg-amber-50', 'border-amber-400');
          if (opt.dataset.key === q.correct_answer) {
            opt.classList.add('bg-green-50', 'border-green-400');
          }
        });
      } else {
        const input = document.querySelector(`[data-question-id="${q.id}"] input`);
        if (input) { input.value = q.correct_answer; input.classList.add('border-green-400'); }
      }
    });
    const warn = document.getElementById('quizWarning');
    if (warn) warn.classList.add('hidden');
    document.getElementById('submitQuizBtn').disabled = false;
  }

    // SUBMIT QUIZ (MC + Fill Arab + Fill Latin)
    // ═══════════════════════════════════════
    document.getElementById('submitQuizBtn').addEventListener('click', () => {
      if (Object.keys(selectedAnswers).length < currentSessionQuestions.length) {
        const unanswered = currentSessionQuestions.length - Object.keys(selectedAnswers).length;
        const warn = document.getElementById('quizWarning');
        document.getElementById('quizWarningText').textContent =
          `Silakan jawab seluruh soal terlebih dahulu (${unanswered} soal belum dijawab).`;
        warn.classList.remove('hidden');
        warn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        return;
      }
      document.getElementById('quizWarning').classList.add('hidden');

      quizSubmitted = true;
      document.getElementById('submitQuizBtn').disabled = true;

      let correct = 0;
      const total = currentSessionQuestions.length;
      const resultDiv = document.getElementById('quizResult');

      // Validate each answer
      currentSessionQuestions.forEach(q => {
        const userAnswer = (selectedAnswers[q.id] || '').trim();
        const isCorrect = checkAnswer(userAnswer, q.correct_answer, q.type);

        if (q.type === 'mc') {
          // MC: highlight options
          const options = document.querySelectorAll(`[data-question-id="${q.id}"] .quiz-option`);
          options.forEach(opt => {
            if (opt.dataset.key === q.correct_answer) opt.classList.add('correct');
            if (opt.dataset.key === userAnswer && userAnswer !== q.correct_answer) opt.classList.add('wrong');
          });
        } else {
          // Fill: highlight input
          const input = document.querySelector(`[data-question-id="${q.id}"] input`);
          if (input) {
            input.style.borderColor = isCorrect ? '#16a34a' : '#ef4444';
            input.style.backgroundColor = isCorrect ? '#dcfce7' : '#fef2f2';
          }
        }

        if (isCorrect) correct++;
      });

      const score = Math.round((correct / total) * 100);
      const passed = score >= PASSING_THRESHOLD;

      resultDiv.classList.remove('hidden', 'bg-red-50', 'border-red-200', 'text-red-700',
                                  'bg-green-50', 'border-green-200', 'text-green-700');
      if (passed) {
        resultDiv.classList.add('bg-green-50', 'border-green-200', 'text-green-700');
        resultDiv.innerHTML = `
          <div class="flex items-center gap-2 mb-1">
            <i class="fa-solid fa-circle-check text-green-600"></i>
            <strong>LULUS!</strong> Skor: ${score}%
          </div>
          <p class="text-xs mt-1">Materi sudah dipahami 100%. Bab berikutnya sudah terbuka.</p>
        `;
        if (!progressMap[currentFasalId]) {
          progressMap[currentFasalId] = { status: 'unlocked', quiz_score: null, quiz_attempts: 0 };
        }
        progressMap[currentFasalId].status = 'completed';
        progressMap[currentFasalId].quiz_score = score;
        // Simpan ke Supabase (silent fail kalau belum login)
        saveProgress(currentFasalId, score, (progressMap[currentFasalId].quiz_attempts || 1), 'completed')
          .catch(err => console.warn('Gagal simpan progress:', err.message));
        unlockNextFasal();
      } else {
        resultDiv.classList.add('bg-red-50', 'border-red-200', 'text-red-700');
        resultDiv.innerHTML = `
          <div class="flex items-center gap-2 mb-1">
            <i class="fa-solid fa-circle-xmark text-red-600"></i>
            <strong>BELUM LULUS.</strong> Skor: ${score}% (min. 100%)
          </div>
          <p class="text-xs mt-1">Silakan pelajari kembali materi, lalu tekan tombol di bawah.</p>
          <button onclick="retryQuiz()" class="mt-2 px-4 py-1.5 bg-red-100 hover:bg-red-200 text-red-700 text-xs font-semibold rounded-lg transition">
            <i class="fa-solid fa-rotate mr-1"></i> Ulangi Kuis
          </button>
        `;
      }

      document.getElementById('quizActions').classList.add('hidden');
    });

    // ═══════════════════════════════════════
    // NORMALIZE ANSWER FOR COMPARISON
    // ═══════════════════════════════════════
    function normalizeAnswer(answer, type) {
      let a = (answer || '').trim();
      if (type === 'fill-latin') {
        a = a.toLowerCase();
      } else if (type === 'fill-arab') {
        // Strip harakat (fatha, kasrah, dhammah, sukun, tanwin)
        a = a.replace(/[ً-ْ]/g, '').replace(/[ـ]/g, '');
      }
      return a;
    }

    function checkAnswer(userAnswer, correctAnswer, type) {
      return normalizeAnswer(userAnswer, type) === normalizeAnswer(correctAnswer, type);
    }

    // ═══════════════════════════════════════
    // RETRY QUIZ (acak ulang 10 soal baru)
    // ═══════════════════════════════════════
    window.retryQuiz = function() {
      selectedAnswers = {};
      quizSubmitted = false;
      loadFasal(currentFasalId);
    };

    // ═══════════════════════════════════════
    // UNLOCK NEXT FASAL
    // ═══════════════════════════════════════
    function unlockNextFasal() {
      // Flatten all fasal from kurikulum data
      const allFasal = [];
      kurikulumData.forEach(bagian => {
        (bagian.bab || []).forEach(bab => {
          (bab.fasal || []).forEach(fasal => allFasal.push(fasal));
        });
      });

      const currentIdx = allFasal.findIndex(f => f.id === currentFasalId);
      if (currentIdx < allFasal.length - 1) {
        const nextFasal = allFasal[currentIdx + 1];
        // Update local progress map
        if (!progressMap[nextFasal.id]) {
          progressMap[nextFasal.id] = { status: 'unlocked', quiz_score: null, quiz_attempts: 0 };
        } else {
          progressMap[nextFasal.id].status = 'unlocked';
        }
        saveProgress(nextFasal.id, null, 0, 'unlocked').catch(() => {});

        // Show done button
        const doneSection = document.getElementById('doneSection');
        doneSection.classList.remove('hidden');
        document.getElementById('doneBtn').onclick = () => loadFasal(nextFasal.id);
      } else {
        // Last fasal
        const doneSection = document.getElementById('doneSection');
        doneSection.classList.remove('hidden');
        document.getElementById('doneBtn').innerHTML = '<i class="fa-solid fa-trophy text-yellow-400 mr-1"></i> Bagian Selesai!';
        document.getElementById('doneBtn').disabled = true;
        document.getElementById('doneBtn').classList.add('opacity-60');
      }

      renderSidebar();
      updateProgressBar();
    }

    // ═══════════════════════════════════════
    // PROGRESS BAR
    // ═══════════════════════════════════════
    function updateProgressBar() {
      const allFasal = [];
      kurikulumData.forEach(bagian => {
        (bagian.bab || []).forEach(bab => {
          (bab.fasal || []).forEach(fasal => allFasal.push(fasal));
        });
      });

      const total = allFasal.length;
      const completed = Object.values(progressMap).filter(p => p.status === 'completed').length;
      const pct = total > 0 ? Math.round((completed / total) * 100) : 0;
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('progressPercent').textContent = pct + '%';
    }

    // ═══════════════════════════════════════
    // SIDEBAR TOGGLE
    // ═══════════════════════════════════════
    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebar').classList.add('-translate-x-full');
      document.getElementById('sidebarOverlay').classList.add('hidden');
    }

    document.getElementById('menuToggle').addEventListener('click', () => {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebarOverlay');
      if (sidebar.classList.contains('-translate-x-full')) {
        sidebar.classList.remove('-translate-x-full');
        sidebar.classList.add('open');
        overlay.classList.remove('hidden');
      } else {
        closeSidebar();
      }
    });

    // ═══════════════════════════════════════
    // ═══════════════════════════════════════
  // LOGOUT
  // ═══════════════════════════════════════
  function handleLogout() {
    if (!confirm('Yakin ingin keluar?')) return;
    logout();
    window.location.href = '../pages/auth.html';
  }

    // INIT — async bootstrap
    // ═══════════════════════════════════════
    async function init() {
      try {
        // Fetch kurikulum from API
        kurikulumData = await fetchKurikulum();
      } catch (err) {
        console.error('Gagal mengambil kurikulum, menggunakan fallback:', err);
        kurikulumData = DUMMY_KURIKULUM;
      }

      try {
        // Fetch all user progress
        const allProgress = await fetchUserProgress();
        allProgress.forEach(p => { progressMap[p.fasal_id] = p; });
      } catch (err) {
        console.error('Gagal mengambil progress, menggunakan fallback:', err);
        Object.assign(progressMap, DUMMY_USER_PROGRESS);
      }

      // MVP demo: auto-unlock first fasal if no progress exists
      if (Object.keys(progressMap).length === 0 && kurikulumData.length > 0) {
        let firstId = null;
        outer: for (const bagian of kurikulumData) {
          for (const bab of (bagian.bab || [])) {
            for (const fasal of (bab.fasal || [])) {
              firstId = fasal.id;
              break outer;
            }
          }
        }
        if (firstId) progressMap[firstId] = { status: 'unlocked' };
      }

      renderSidebar();

      // Find the first fasal from the kurikulum (first bagian, first bab, first fasal)
      let firstFasalId = null;
      outer: for (const bagian of kurikulumData) {
        for (const bab of (bagian.bab || [])) {
          for (const fasal of (bab.fasal || [])) {
            firstFasalId = fasal.id;
            break outer;
          }
        }
      }

      if (firstFasalId) {
        await loadFasal(firstFasalId);
      } else {
        document.getElementById('contentArab').innerHTML = '<p class="text-slate-400 italic">Tidak ada fasal tersedia.</p>';
        document.getElementById('contentId').textContent = 'Kurikulum belum tersedia.';
      }
    }

    init();
  </script>
