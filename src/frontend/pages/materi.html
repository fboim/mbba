<!DOCTYPE html>
<html lang="id" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materi — MBBA</title>
  <link rel="icon" href="../img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/output.css">
  <style>
    :root {
      --bg-base: #F8F9FA;
      --bg-card: #FFFFFF;
      --text-primary: #1A1D23;
      --text-secondary: #4A5568;
      --text-muted: #94A3B8;
      --border-subtle: rgba(0, 0, 0, 0.06);
      --border-soft: rgba(0, 0, 0, 0.08);
      --accent: #059669;
      --accent-light: #10B981;
      --accent-soft: #ECFDF5;
      --amber: #F59E0B;
      --amber-soft: #FFFBEB;
      --blue: #3B82F6;
      --blue-soft: #EFF6FF;
      --purple: #8B5CF6;
      --purple-soft: #F5F3FF;
      --red: #EF4444;
      --red-soft: #FEF2F2;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.02), 0 4px 8px rgba(0,0,0,0.02);
      --shadow-md: 0 2px 4px rgba(0,0,0,0.02), 0 8px 16px rgba(0,0,0,0.03);
      --shadow-lg: 0 4px 8px rgba(0,0,0,0.03), 0 16px 32px rgba(0,0,0,0.04);
      --radius-sm: 16px;
      --radius-md: 20px;
      --radius-lg: 28px;
    }

    .dark {
      --bg-base: #0C0E14;
      --bg-card: #141820;
      --bg-elevated: #1A1F2B;
      --text-primary: #F1F5F9;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --border-subtle: rgba(255, 255, 255, 0.04);
      --border-soft: rgba(255, 255, 255, 0.08);
      --accent-soft: rgba(5, 150, 105, 0.12);
      --amber-soft: rgba(245, 158, 11, 0.12);
      --blue-soft: rgba(59, 130, 246, 0.12);
      --purple-soft: rgba(139, 92, 246, 0.12);
      --red-soft: rgba(239, 68, 68, 0.12);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    ::selection { background: var(--accent-soft); color: var(--accent); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-soft); border-radius: 3px; }

    /* Arabic Typography — 35% larger for diacritics */
    .arabic {
      font-family: 'Amiri', serif;
      direction: rtl;
      text-align: right;
      line-height: 2.4;
      letter-spacing: 0.01em;
    }
    .arabic-sm { font-size: 1.25rem; line-height: 2.4; }
    .arabic-md { font-size: 1.6rem; line-height: 2.6; }
    .arabic-lg { font-size: 2rem; line-height: 2.8; }
    .arabic-xl { font-size: 2.4rem; line-height: 3; }

    /* Bento Grid */
    .bento-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    @media (min-width: 768px) {
      .bento-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 1024px) {
      .bento-grid { grid-template-columns: repeat(3, 1fr); gap: 24px; }
    }

    .bento-span-2 { grid-column: span 1; }
    @media (min-width: 1024px) { .bento-span-2 { grid-column: span 2; } }
    .bento-span-3 { grid-column: span 1; }
    @media (min-width: 768px) { .bento-span-3 { grid-column: span 2; } }
    @media (min-width: 1024px) { .bento-span-3 { grid-column: span 3; } }

    .bento-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .bento-inner {
      padding: 24px;
    }
    @media (min-width: 768px) {
      .bento-inner { padding: 28px; }
    }

    /* Navigation */
    .nav {
      position: sticky;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(248, 249, 250, 0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-subtle);
    }
    .dark .nav {
      background: rgba(12, 14, 20, 0.9);
    }
    .nav-inner {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 24px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: var(--text-primary);
    }
    .nav-logo-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(145deg, var(--accent), var(--accent-light));
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(5, 150, 105, 0.3);
      overflow: hidden;
      padding: 4px;
    }
    .nav-logo-icon img { width: 100%; height: 100%; object-fit: contain; }
    .nav-logo-text { font-weight: 800; font-size: 1.25rem; letter-spacing: -0.02em; }
    .nav-actions { display: flex; align-items: center; gap: 12px; }
    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: 1px solid var(--border-soft);
      background: var(--bg-card);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.25s ease;
      text-decoration: none;
    }
    .nav-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
    }
    .nav-btn-text {
      width: auto;
      padding: 0 16px;
      gap: 8px;
      font-weight: 500;
      font-size: 0.875rem;
    }

    /* Breadcrumb */
    .breadcrumb {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-subtle);
      padding: 16px 24px;
    }
    .breadcrumb-inner {
      max-width: 1280px;
      margin: 0 auto;
    }
    .breadcrumb-list {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      flex-wrap: wrap;
    }
    .breadcrumb-link {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .breadcrumb-link:hover { color: var(--accent); }
    .breadcrumb-sep { color: var(--text-muted); }
    .breadcrumb-current { color: var(--accent); font-weight: 600; }

    /* Main Container */
    .main-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 32px 24px;
    }

    /* Header Card */
    .header-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      margin-bottom: 24px;
    }
    .header-card-inner {
      background: linear-gradient(135deg, var(--accent-soft), #D1FAE5);
      padding: 24px;
      border-bottom: 1px solid rgba(5, 150, 105, 0.1);
    }
    .header-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }
    .header-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-green { background: var(--accent-soft); color: var(--accent); }
    .badge-amber { background: var(--amber-soft); color: var(--amber); }
    .badge-blue { background: var(--blue-soft); color: var(--blue); }
    .badge-slate { background: var(--bg-base); color: var(--text-muted); }
    .badge-success { background: var(--accent-soft); color: var(--accent); }
    .header-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .header-subtitle {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }
    .header-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: var(--bg-card);
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* Bento Card Header */
    .bento-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .bento-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .bento-icon-green { background: var(--accent-soft); color: var(--accent); }
    .bento-icon-blue { background: var(--blue-soft); color: var(--blue); }
    .bento-icon-purple { background: var(--purple-soft); color: var(--purple); }
    .bento-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    /* Content Boxes */
    .content-box {
      padding: 24px;
    }
    .arabic-content {
      font-family: 'Amiri', serif;
      direction: rtl;
      text-align: right;
      line-height: 2.6;
      font-size: 1.5rem;
      color: var(--text-primary);
    }
    .translation-content {
      font-size: 0.95rem;
      line-height: 1.8;
      color: var(--text-secondary);
    }

    /* Quiz Action Card */
    .quiz-action-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 24px;
      margin-top: 24px;
    }
    .quiz-action-inner {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }
    .quiz-action-content {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .quiz-action-icon {
      width: 48px;
      height: 48px;
      background: var(--accent-soft);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 1.25rem;
    }
    .quiz-action-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .quiz-action-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .quiz-action-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.25s ease;
      border: none;
      text-decoration: none;
    }
    .btn-primary {
      background: linear-gradient(145deg, var(--accent), var(--accent-light));
      color: white;
      box-shadow: 0 4px 16px rgba(5, 150, 105, 0.25);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(5, 150, 105, 0.35);
    }
    .btn-secondary {
      background: var(--bg-base);
      color: var(--text-secondary);
      border: 1px solid var(--border-soft);
    }
    .btn-secondary:hover {
      background: var(--accent-soft);
      color: var(--accent);
    }

    /* Quiz Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(26, 29, 35, 0.6);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-y: auto;
    }
    .modal-content {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 640px;
      overflow: hidden;
    }
    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .modal-title-icon {
      width: 44px;
      height: 44px;
      background: var(--accent-soft);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
    }
    .modal-title-text h3 {
      font-size: 1.1rem;
      font-weight: 700;
    }
    .modal-title-text p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .modal-close {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text-muted);
      background: transparent;
      border: none;
    }
    .modal-close:hover {
      background: var(--bg-base);
      color: var(--text-primary);
    }

    /* Progress Bar */
    .quiz-progress {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .quiz-progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .quiz-progress-text {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .quiz-progress-percent {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
    }
    .quiz-progress-bar {
      height: 6px;
      background: var(--bg-base);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .quiz-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent-light));
      border-radius: 3px;
      transition: width 0.4s ease;
    }
    .quiz-progress-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .progress-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--bg-base);
      transition: all 0.3s;
      cursor: pointer;
    }
    .progress-dot.current {
      background: var(--accent);
      transform: scale(1.3);
    }
    .progress-dot.answered { background: var(--blue); }
    .progress-dot.correct { background: var(--accent); }
    .progress-dot.wrong { background: var(--red); }

    /* Quiz Body */
    .quiz-body {
      padding: 24px;
      min-height: 200px;
      background: #fef9c3;
    }
    .quiz-no-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      background: var(--bg-base);
      border-radius: var(--radius-md);
      border: 2px dashed var(--border-soft);
    }
    .quiz-question-type {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .quiz-question-type.mc { background: var(--blue-soft); color: var(--blue); }
    .quiz-question-type.arab { background: var(--accent-soft); color: var(--accent); }
    .quiz-question-type.latin { background: var(--amber-soft); color: var(--amber); }
    .quiz-question-box {
      padding: 20px;
      background: var(--bg-base);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      margin-bottom: 20px;
    }
    .quiz-question-text {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.6;
    }
    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .quiz-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      background: var(--bg-card);
      border: 2px solid var(--border-soft);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.25s;
    }
    .quiz-option:hover:not(.disabled) {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .quiz-option.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .quiz-option.correct {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .quiz-option.incorrect {
      border-color: var(--red);
      background: var(--red-soft);
    }
    .quiz-option-key {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      flex-shrink: 0;
      background: var(--bg-base);
      color: var(--text-muted);
    }
    .quiz-option.selected .quiz-option-key {
      background: var(--accent);
      color: white;
    }
    .quiz-option-text {
      flex: 1;
      font-weight: 500;
    }
    .quiz-option-check {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .quiz-option.selected .quiz-option-check {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }
    .quiz-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 20px;
      margin-top: 20px;
      border-top: 1px solid var(--border-subtle);
    }

    /* Fill Input */
    .quiz-fill-input {
      width: 100%;
      padding: 16px;
      border: 2px solid var(--border-soft);
      border-radius: var(--radius-md);
      font-size: 1.1rem;
      background: var(--bg-card);
      color: var(--text-primary);
      transition: all 0.2s;
    }
    .quiz-fill-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.12);
    }

    /* Loading */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px;
      color: var(--text-muted);
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border-subtle);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up {
      animation: fadeInUp 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    /* Audio Player */
    .audio-player-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      margin-bottom: 24px;
    }
    .audio-player-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 20px 24px;
      border-bottom: 1px solid var(--border-subtle);
    }
    .audio-player-icon {
      width: 48px;
      height: 48px;
      background: var(--purple-soft);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--purple);
      font-size: 1.25rem;
      flex-shrink: 0;
    }
    .audio-player-info h3 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    .audio-player-info p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .audio-player-body {
      padding: 24px;
    }
    .audio-waveform {
      height: 64px;
      background: var(--bg-base);
      border-radius: 12px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .audio-waveform canvas {
      width: 100%;
      height: 100%;
    }
    .audio-controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .audio-play-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--purple), #7C3AED);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      transition: all 0.25s ease;

  <script src="/js/api.js"></script>
  <script>
    window.onerror = function(msg, src, line, col, err) {
      var e = document.createElement('div');
      e.style = 'position:fixed;bottom:0;left:0;right:0;background:#dc2626;color:white;padding:16px;font-family:monospace;font-size:13px;z-index:99999;white-space:pre-wrap;max-height:200px;overflow:auto;';
      e.textContent = 'JS ERROR: ' + (err ? err.message : msg) + ' Line: ' + line;
      document.body.appendChild(e);
      return true;
    };

    // ================================================================
    // QUIZ STATE (module-level variables)
    // ================================================================
    window._quizState = null;
    var quizQuestions = [];
    var currentQuestionIndex = 0;
    var answeredQuestions = {};

    // ================================================================
    // QUIZ CORE FUNCTIONS
    // ================================================================

    function shuffleQuiz(bank, count) {
      count = count || 10;
      var shuffled = bank.slice().sort(function() { return Math.random() - 0.5; });
      return shuffled.slice(0, Math.min(count, bank.length));
    }

    function initQuiz(bank, fasalId, count, callbacks) {
      var questions = shuffleQuiz(bank, count);
      window._quizState = {
        questions: questions,
        fasalId: fasalId,
        count: count,
        selectedAnswers: {},
        submitted: false,
        callbacks: callbacks || {}
      };
      return questions;
    }

    function setAnswer(questionId, answer) {
      var state = window._quizState;
      if (!state || state.submitted) return;
      state.selectedAnswers[questionId] = answer;
    }

    function normalizeAnswer(answer, type) {
      if (!answer) return '';
      var n = answer.trim();
      if (type === 'fill-latin') n = n.toLowerCase();
      if (type === 'fill-arab') n = n.replace(/[ً-ْ]/g, '').replace(/[ـ]/g, '');
      return n;
    }

    function submitQuizResult() {
      var state = window._quizState;
      if (!state) throw new Error('Quiz not initialized');
      if (state.submitted) return;
      state.submitted = true;

      var correct = 0, results = [];
      state.questions.forEach(function(q) {
        var userAns = normalizeAnswer(state.selectedAnswers[q.id], q.type);
        var corrAns = normalizeAnswer(q.correct_answer, q.type);
        var isCorrect = userAns === corrAns;
        if (isCorrect) correct++;
        results.push({ questionId: q.id, isCorrect: isCorrect, userAnswer: userAns, correctAnswer: corrAns });
      });

      var score = Math.round((correct / state.questions.length) * 100);
      var passed = score >= 100;
      var result = { score: score, passed: passed, correct: correct, total: state.questions.length, results: results };

      if (passed && state.callbacks.onPass) state.callbacks.onPass(score, correct, state.questions.length, results);
      else if (!passed && state.callbacks.onFail) state.callbacks.onFail(score, correct, state.questions.length, results);

      return result;
    }

    function resetQuiz(bank) {
      var state = window._quizState;
      if (!state || !bank) return;
      state.questions = shuffleQuiz(bank);
      state.selectedAnswers = {};
      state.submitted = false;
      return state.questions;
    }

    // ================================================================
    // RENDER QUESTION
    // ================================================================

    function renderQuestion() {
      var state = window._quizState;
      var container = document.getElementById('quizContent');
      var answers = state ? (state.selectedAnswers || {}) : {};
      var total = state ? state.questions.length : 0;
      var idx = total > 0 ? Math.min(currentQuestionIndex, total - 1) : 0;

      // Update header
      document.getElementById('currentQ').textContent = total > 0 ? (idx + 1) : 1;
      document.getElementById('totalQ').textContent = total > 0 ? total : 10;
      var pct = total > 0 ? Math.round(((idx + 1) / total) * 100) : 0;
      document.getElementById('progressPercent').textContent = pct + '%';
      document.getElementById('progressBar').style.width = (total > 0 ? Math.max(pct, 2) : 2) + '%';

      // Update dots
      var dotsEl = document.getElementById('questionDots');
      dotsEl.innerHTML = '';
      if (state && state.questions) {
        state.questions.forEach(function(qi, i) {
          var isAnswered = !!answers[qi.id];
          var isCurrent = i === idx;
          var isCorrect = answeredQuestions[qi.id] === true;
          var isWrong = answeredQuestions[qi.id] === false;
          var cls = 'progress-dot';
          if (isCurrent) cls += ' current';
          else if (isCorrect) cls += ' correct';
          else if (isWrong) cls += ' wrong';
          else if (isAnswered) cls += ' answered';
          var btn = document.createElement('button');
          btn.className = cls;
          btn.title = 'Soal ' + (i + 1);
          btn.style.cssText = 'background:none;border:none;cursor:pointer;padding:0;';
          btn.onclick = (function(ii) { return function() { goToQuestion(ii); }; })(i);
          dotsEl.appendChild(btn);
        });
      }

      container.innerHTML = '';

      if (!state || !state.questions || state.questions.length === 0) {
        container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:200px;"><p style="color:#ef4444;">Quiz tidak tersedia.</p></div>';
        return;
      }

      var q = state.questions[idx];
      if (!q || !q.id) {
        container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:200px;"><p style="color:#94a3b8;">Data soal tidak valid.</p></div>';
        return;
      }

      // Badge
      var badge = document.createElement('span');
      var qtype = q.type || 'mc';
      badge.className = 'quiz-question-type' + (qtype === 'mc' ? ' mc' : qtype === 'fill-arab' ? ' arab' : ' latin');
      badge.innerHTML = qtype === 'mc' ? '<i class="fa-solid fa-list-check"></i> Pilihan Ganda' :
                        qtype === 'fill-arab' ? '<i class="fa-solid fa-pen"></i> Isi Arab' :
                        '<i class="fa-solid fa-pen"></i> Isi Latin';
      container.appendChild(badge);

      // Question box
      var qBox = document.createElement('div');
      qBox.className = 'quiz-question-box';
      var qText = q.question || '';
      if (!qText.trim()) {
        qBox.classList.add('quiz-no-content');
        qBox.innerHTML = '<i class="fa-solid fa-circle-info" style="color:#94a3b8;font-size:1.5rem;margin-bottom:8px;display:block;"></i><p style="color:#94a3b8;font-size:0.9rem;">Pertanyaan ini belum memiliki teks.</p>';
      } else {
        var qP = document.createElement('p');
        qP.className = 'quiz-question-text';
        qP.textContent = qText;
        qBox.appendChild(qP);
      }
      container.appendChild(qBox);

      // Options or fill input
      if (qtype === 'mc' && q.options) {
        var optsObj = {};
        try {
          var parsed = JSON.parse(q.options);
          if (Array.isArray(parsed)) parsed.forEach(function(item) { optsObj[item.key] = item.value; });
          else optsObj = parsed;
        } catch(e) {}

        var optsDiv = document.createElement('div');
        optsDiv.className = 'quiz-options';
        Object.keys(optsObj).forEach(function(key) {
          var isSelected = answers[q.id] === key;
          var optDiv = document.createElement('div');
          optDiv.className = 'quiz-option' + (isSelected ? ' selected' : '');
          optDiv.style.cssText = 'display:flex;align-items:center;gap:12px;padding:16px;margin-bottom:8px;border-radius:12px;border:2px solid #e2e8f0;cursor:pointer;transition:all 0.2s;background:#fff;';
          optDiv.onmouseover = function() { if (!isSelected) optDiv.style.borderColor = '#10b981'; };
          optDiv.onmouseout = function() { if (!isSelected) optDiv.style.borderColor = '#e2e8f0'; };
          optDiv.onclick = (function(qid, k) { return function() { window.quizSelectAnswer(qid, k); }; })(q.id, key);

          var keyDiv = document.createElement('div');
          keyDiv.className = 'quiz-option-key';
          keyDiv.style.cssText = 'width:36px;height:36px;border-radius:10px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.9rem;color:#475569;flex-shrink:0;';
          keyDiv.textContent = key;

          var txtDiv = document.createElement('div');
          txtDiv.className = 'quiz-option-text';
          txtDiv.style.cssText = 'flex:1;font-weight:500;';
          txtDiv.textContent = optsObj[key];

          var chkDiv = document.createElement('div');
          chkDiv.className = 'quiz-option-check';
          chkDiv.style.cssText = 'color:#10b981;opacity:' + (isSelected ? '1' : '0') + ';transition:opacity 0.2s;';
          chkDiv.innerHTML = '<i class="fa-solid fa-check text-xs"></i>';

          optDiv.appendChild(keyDiv);
          optDiv.appendChild(txtDiv);
          optDiv.appendChild(chkDiv);
          optsDiv.appendChild(optDiv);
        });
        container.appendChild(optsDiv);
      } else {
        var inp = document.createElement('input');
        inp.type = 'text';
        inp.id = 'answerInput';
        inp.value = answers[q.id] || '';
        inp.placeholder = 'Ketik jawaban...';
        inp.className = 'quiz-fill-input';
        inp.style.cssText = 'width:100%;padding:16px;border-radius:12px;border:2px solid #e2e8f0;font-size:1.1rem;outline:none;box-sizing:border-box;';
        inp.oninput = (function(qid) { return function() { setAnswer(qid, inp.value); }; })(q.id);
        container.appendChild(inp);
      }

      // Navigation buttons
      var navDiv = document.createElement('div');
      navDiv.className = 'quiz-nav';

      var backBtn = document.createElement('button');
      backBtn.className = 'btn btn-secondary' + (currentQuestionIndex === 0 ? ' opacity-50' : '');
      backBtn.disabled = currentQuestionIndex === 0;
      backBtn.innerHTML = '<i class="fa-solid fa-arrow-left"></i> Kembali';
      if (currentQuestionIndex > 0) backBtn.onclick = window.quizPrevQuestion;
      navDiv.appendChild(backBtn);

      var actionBtn = document.createElement('button');
      actionBtn.className = 'btn btn-primary';
      if (currentQuestionIndex < total - 1) {
        actionBtn.innerHTML = 'Lanjut <i class="fa-solid fa-arrow-right"></i>';
        actionBtn.onclick = window.quizNextQuestion;
      } else {
        actionBtn.innerHTML = '<i class="fa-solid fa-check"></i> Kirim';
        actionBtn.onclick = window.quizSubmit;
      }
      navDiv.appendChild(actionBtn);

      container.appendChild(navDiv);
    }

    // ================================================================
    // QUIZ NAVIGATION (attached to window)
    // ================================================================

    window.quizPrevQuestion = function() {
      if (currentQuestionIndex > 0) { currentQuestionIndex--; renderQuestion(); }
    };

    window.quizNextQuestion = function() {
      if (currentQuestionIndex < quizQuestions.length - 1) { currentQuestionIndex++; renderQuestion(); }
    };

    window.goToQuestion = function(index) {
      currentQuestionIndex = index;
      renderQuestion();
    };

    window.quizSelectAnswer = function(qid, ans) {
      setAnswer(qid, ans);
      answeredQuestions[qid] = null;
      renderQuestion();
    };

    window.quizSubmit = function() {
      var result = submitQuizResult();
      if (!result) return;

      var state = window._quizState;
      if (result.results) {
        result.results.forEach(function(r) {
          answeredQuestions[r.questionId] = r.isCorrect;
        });
      }

      var container = document.getElementById('quizContent');
      var passed = result.passed;
      var icon = passed ? 'fa-check-circle' : 'fa-times-circle';
      var iconColor = passed ? '#22c55e' : '#ef4444';
      var bgClass = passed ? 'from-green-50 to-emerald-50' : 'from-red-50 to-orange-50';
      var title = passed ? 'Alhamdulillah!' : 'Belum Lulus';
      var titleColor = passed ? '#16a34a' : '#dc2626';
      var msg = passed ? 'Semua jawabanmu benar!' : 'Skor: ' + result.score + '%. Syarat: 100%.';

      container.innerHTML = '<div style="text-align:center;padding:48px 24px;background:linear-gradient(180deg, ' + (passed ? '#f0fdf4' : '#fef2f2') + ', #fff);border-radius:16px;">';
      container.innerHTML += '<div style="width:96px;height:96px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;box-shadow:0 8px 32px rgba(0,0,0,0.1);">';
      container.innerHTML += '<i class="fa-solid ' + icon + '" style="font-size:3rem;color:' + iconColor + ';"></i>';
      container.innerHTML += '</div>';
      container.innerHTML += '<h3 style="font-size:2rem;font-weight:700;color:' + titleColor + ';margin-bottom:12px;">' + title + '</h3>';
      container.innerHTML += '<p style="color:#64748b;margin-bottom:24px;">' + msg + '</p>';
      container.innerHTML += '<div style="display:inline-flex;align-items:center;gap:24px;background:#fff;padding:16px 24px;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,0.08);margin-bottom:24px;">';
      container.innerHTML += '<div style="text-align:center;"><div style="font-size:2rem;font-weight:700;color:' + iconColor + ';">' + result.score + '%</div><div style="font-size:0.75rem;color:#94a3b8;margin-top:4px;">Skor</div></div>';
      container.innerHTML += '<div style="width:1px;height:40px;background:#e2e8f0;"></div>';
      container.innerHTML += '<div style="text-align:center;"><div style="font-size:2rem;font-weight:700;color:#1e293b;">' + result.correct + '/' + result.total + '</div><div style="font-size:0.75rem;color:#94a3b8;margin-top:4px;">Benar</div></div>';
      container.innerHTML += '</div>';

      if (passed) {
        container.innerHTML += '<a href="student.html" class="btn btn-primary"><i class="fa-solid fa-home"></i> Kembali ke Dashboard</a>';
      } else {
        container.innerHTML += '<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">';
        container.innerHTML += '<button onclick="window.quizRetry()" class="btn btn-primary"><i class="fa-solid fa-redo"></i> Coba Lagi</button>';
        container.innerHTML += '<button onclick="window.quizClose()" class="btn btn-secondary"><i class="fa-solid fa-arrow-left"></i> Kembali</button>';
        container.innerHTML += '</div>';
      }
      container.innerHTML += '</div>';

      if (passed) {
        var id = window.currentFasal ? window.currentFasal.id : window.currentBab ? window.currentBab.id : null;
        if (id) handleQuizComplete(true, result.score, result.correct, result.total);
      }
    };

    window.quizRetry = function() {
      resetQuiz(window.quizBank || []);
      quizQuestions = window._quizState ? window._quizState.questions : [];
      currentQuestionIndex = 0;
      answeredQuestions = {};
      renderQuestion();
    };

    window.quizClose = function() {
      document.getElementById('quizModal').classList.add('hidden');
      document.body.style.overflow = '';
      window.location.href = 'student.html';
    };

    // ================================================================
    // START QUIZ (the main entry point)
    // ================================================================

    window.quizStart = function() {
      var bank = window.quizBank || [];
      if (bank.length === 0) {
        return;
      }
      document.getElementById('quizModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';

      initQuiz(bank, quizId, 10, {
        onPass: function(score, correct, total, results) {
          handleQuizComplete(true, score, correct, total);
          showNextMateriPopup();
        },
        onFail: function(score, correct, total, results) {
          handleQuizComplete(false, score, correct, total);
        }
      });

      // Function to show next materi in popup
      function showNextMateriPopup() {
        var modal = document.getElementById('quizModal');
        var body = document.getElementById('quizModalBody');

        if (window.nextBabId) {
          // Load next bab content
          fetchNextBabContent(window.nextBabId);
        } else {
          // Show completion message
          body.innerHTML = '<div style="text-align:center; padding:40px;">' +
            '<div style="width:80px; height:80px; background:linear-gradient(135deg, var(--accent), var(--accent-light)); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px;"><i class="fa-solid fa-check" style="font-size:2.5rem; color:white;"></i></div>' +
            '<h3 style="color:var(--accent); margin:0 0 8px 0;">Alhamdulillah!</h3>' +
            '<p style="color:var(--text-muted); margin:0 0 24px 0;">Kamu telah menyelesaikan semua materi.</p>' +
            '<button onclick="closeQuizModalAndReturn()" class="btn btn-primary"><i class="fa-solid fa-home"></i> Kembali ke Beranda</button>' +
            '</div>';
        }
      }

      async function fetchNextBabContent(babId) {
        try {
          var res = await fetch(SUPABASE_URL + 'rest/v1/bab?id=eq.' + babId, {
            headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + getToken() }
          });
          var data = await res.json();
          var nextBab = data[0];
          if (!nextBab) return;

          // Show next materi content in popup
          var body = document.getElementById('quizModalBody');
          body.innerHTML = '<div style="padding:20px;">' +
            '<div style="margin-bottom:16px;"><span class="badge badge-green">' + (nextBab.is_muqoddimah ? 'MUQODDIMAH' : 'MATERI') + '</span></div>' +
            '<h3 style="margin:0 0 16px 0; color:var(--text-primary);">' + (nextBab.title || nextBab.nama || 'Materi Berikutnya') + '</h3>';

          if (nextBab.content_arab) {
            body.innerHTML += '<div style="background:#fef3c7; padding:16px; border-radius:12px; margin-bottom:16px;">' +
              '<p style="font-family:Amiri,serif; font-size:1.3rem; direction:rtl; text-align:right; line-height:2; margin:0;">' + escHtml(nextBab.content_arab) + '</p>' +
              '</div>';
          }
          if (nextBab.content_id) {
            body.innerHTML += '<div style="background:var(--bg-base); padding:16px; border-radius:12px; margin-bottom:16px;">' +
              '<p style="margin:0; line-height:1.8;">' + escHtml(nextBab.content_id) + '</p>' +
              '</div>';
          }

          body.innerHTML += '<div style="display:flex; gap:12px; justify-content:flex-end;">' +
            '<button onclick="closeQuizModalAndReturn()" class="btn btn-secondary"><i class="fa-solid fa-home"></i> Kembali</button>' +
            '<button onclick="loadMateriFromPopup(\'' + babId + '\')" class="btn btn-primary"><i class="fa-solid fa-play"></i> Mulai Belajar</button>' +
            '</div></div>';

        } catch(e) {
          console.error('Error loading next bab:', e);
        }
      }

      function closeQuizModalAndReturn() {
        document.getElementById('quizModal').classList.add('hidden');
        document.body.style.overflow = '';
        window.location.href = 'student.html';
      }

      window.loadMateriFromPopup = function(babId) {
        document.getElementById('quizModal').classList.add('hidden');
        document.body.style.overflow = '';
        window.location.href = 'materi.html?bab=' + babId;
      };

      quizQuestions = window._quizState.questions;
      currentQuestionIndex = 0;
      answeredQuestions = {};
      document.getElementById('totalQ').textContent = quizQuestions.length;

      renderQuestion();
    };

    // ================================================================
    // PAGE INIT & DATA LOADING
    // ================================================================

    window.currentFasal = null;
    window.currentBab = null;
    window.quizBank = [];

    var urlParams = new URLSearchParams(window.location.search);
    var fasalId = urlParams.get('id');
    var babId = urlParams.get('bab');
    var kitabId = urlParams.get('kitab');

    (async function() {
      var user = await getCurrentUser();
      if (!user) { window.location.href = 'auth.html'; return; }
      var role = (user.user_metadata && user.user_metadata.role) || 'student';
      if (role === 'admin' || role === 'teacher') {
        document.getElementById('adminLinkMateri').classList.remove('hidden');
      }
      if (babId) { await loadBab(babId); }
      else if (fasalId) { await loadFasal(fasalId); }
      else if (kitabId) { await loadKitab(kitabId); }
      else { window.location.href = 'student.html'; }

      // Initialize swipe gestures for mobile
      initSwipeGestures();
    })();

    // Swipe Gestures for Mobile Navigation
    function initSwipeGestures() {
      var startX = 0;
      var endX = 0;
      var content = document.getElementById('fasalContent');

      if (!content) return;

      content.addEventListener('touchstart', function(e) {
        startX = e.touches[0].clientX;
      }, { passive: true });

      content.addEventListener('touchend', function(e) {
        endX = e.changedTouches[0].clientX;
        handleSwipe();
      }, { passive: true });

      function handleSwipe() {
        var diff = startX - endX;
        if (Math.abs(diff) < 100) return; // Minimum swipe distance

        if (diff > 50 && window.nextBabId) {
          // Swipe left - go to next
          window.location.href = 'materi.html?bab=' + window.nextBabId;
        } else if (diff < -50 && window.prevBabId) {
          // Swipe right - go to previous
          window.location.href = 'materi.html?bab=' + window.prevBabId;
        }
      }
    }

    async function loadKitab(kitabId) {
      try {
        var res = await fetch(SUPABASE_URL + 'rest/v1/kitab?id=eq.' + kitabId, {
          headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + getToken() }
        });
        var data = await res.json();
        var kitab = data[0];
        if (!kitab) { window.location.href = 'student.html'; return; }

        document.getElementById('breadcrumbKitab').textContent = kitab.nama || kitab.title || 'Kitab';
        document.getElementById('breadcrumbBagian').textContent = 'Daftar Materi';
        document.getElementById('breadcrumbBab').textContent = '-';
        document.getElementById('breadcrumbFasal').textContent = '-';
        document.getElementById('fasalTitle').textContent = kitab.nama || kitab.title || 'Kitab';
        document.getElementById('fasalNumber').textContent = '';
        document.getElementById('fasalType').textContent = 'DAFTAR MATERI';
        document.getElementById('fasalType').className = 'badge badge-purple';
        document.getElementById('fasalBab').textContent = kitab.penulis || '';

        // Load daftar bagian/bab/fasal untuk kitab ini
        var bagianRes = await fetch(SUPABASE_URL + 'rest/v1/bagian?kitab_id=eq.' + kitabId + '&order=order_index', {
          headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + getToken() }
        });
        var bagians = await bagianRes.json().catch(() => []);

        var content = '<div style="padding: 24px;">';

        if (bagians.length === 0) {
          content += '<div style="text-align:center;padding:48px 24px;background:#fef3c7;border-radius:16px;border:1px solid #fcd34d;margin:8px 0;"><i class="fa-solid fa-file-import" style="font-size:2rem;color:#d97706;margin-bottom:12px;display:block;"></i><p style="font-size:1rem;font-weight:600;color:#92400e;margin-bottom:4px;">Materi belum tersedia</p><p style="font-size:0.8rem;color:#b45309;">Admin perlu menambahkan materi terlebih dahulu.</p></div>';
        } else {
          content += '<div style="display:flex;flex-direction:column;gap:16px;">';
          for (var bg of bagians) {
            content += '<div style="background:var(--bg-card);border-radius:16px;padding:16px;border:1px solid var(--border-subtle);">';
            content += '<h3 style="font-size:1rem;font-weight:700;color:var(--text-primary);margin-bottom:12px;">' + (bg.order_index || '') + '. ' + (bg.nama || bg.title || 'Bagian') + '</h3>';

            var babRes = await fetch(SUPABASE_URL + 'rest/v1/bab?bagian_id=eq.' + bg.id + '&order=order_index', {
              headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + getToken() }
            });
            var babs = await babRes.json().catch(() => []);

            content += '<div style="display:flex;flex-direction:column;gap:8px;">';
            for (var bb of babs) {
              content += '<a href="materi.html?bab=' + bb.id + '" style="display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg-base);border-radius:12px;text-decoration:none;color:inherit;transition:all 0.2s;" onmouseover="this.style.background=\'var(--border-subtle)\'" onmouseout="this.style.background=\'var(--bg-base)\'">';
              content += '<div style="width:32px;height:32px;background:#8b5cf6;border-radius:8px;display:flex;align-items:center;justify-content:center;color:white;font-size:0.8rem;font-weight:700;">' + bb.order_index + '</div>';
              content += '<div style="flex:1;">';
              content += '<div style="font-weight:600;font-size:0.9rem;">' + (bb.title || bb.nama || 'Bab ' + bb.order_index) + '</div>';
              content += '<div style="font-size:0.75rem;color:var(--text-muted);">' + (bb.is_muqoddimah ? 'MUQODDIMAH' : 'Daftar Fasal') + '</div>';
              content += '</div>';
              content += '<i class="fa-solid fa-chevron-right" style="color:var(--text-muted);"></i>';
              content += '</a>';
            }
            content += '</div></div>';
          }
          content += '</div>';
        }

        content += '</div>';
        document.getElementById('fasalContent').innerHTML = content;
        document.getElementById('translationSection').classList.add('hidden');

      } catch(err) {
        document.getElementById('fasalContent').innerHTML = '<div style="text-align:center;padding:48px;color:#ef4444;"><i class="fa-solid fa-exclamation-triangle"></i> Gagal memuat: ' + err.message + '</div>';
      }
    }

    async function loadBab(babId) {
      try {
        var res = await fetch(SUPABASE_URL + 'rest/v1/bab?id=eq.' + babId + '&select=*,bagian(*)', {
          headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + getToken() }
        });
        var data = await res.json();
        var bab = data[0];
        if (!bab) { window.location.href = 'student.html'; return; }

        window.currentBab = bab;

        document.getElementById('breadcrumbKitab').textContent = 'Kitab Mukhtarat';
        document.getElementById('breadcrumbBagian').textContent = 'Bagian ' + (bab.bagian ? bab.bagian.order_index : 1);
        document.getElementById('breadcrumbBab').textContent = 'Bab ' + bab.order_index;
        document.getElementById('breadcrumbFasal').textContent = bab.title || 'Muqoddimah';
        document.getElementById('fasalTitle').textContent = bab.title || 'Muqoddimah';
        document.getElementById('fasalNumber').textContent = (bab.bagian ? bab.bagian.order_index : 1) + '.' + bab.order_index;
        document.getElementById('fasalType').textContent = 'MUQODDIMAH';
        document.getElementById('fasalType').className = 'badge badge-amber';
        document.getElementById('fasalBab').textContent = 'Bab ' + bab.order_index + ' dari Bagian ' + (bab.bagian ? bab.bagian.order_index : 1);

        var content = bab.content_arab && bab.content_arab.trim()
          ? bab.content_arab
          : '<div style="text-align:center;padding:48px 24px;background:#fef3c7;border-radius:16px;border:1px solid #fcd34d;margin:8px 0;"><i class="fa-solid fa-file-import" style="font-size:2rem;color:#d97706;margin-bottom:12px;display:block;"></i><p style="font-size:1rem;font-weight:600;color:#92400e;margin-bottom:4px;">Konten belum tersedia</p><p style="font-size:0.8rem;color:#b45309;">Admin perlu menambahkan materi Arab terlebih dahulu.</p></div>';
        document.getElementById('fasalContent').innerHTML = content;

        if (bab.content_id) {
          document.getElementById('translationSection').classList.remove('hidden');
          document.getElementById('fasalTranslation').innerHTML = bab.content_id;
        }

        var progress = null;
        try { progress = await fetchBabProgress(babId); } catch(e) {}
        updateStatus(progress);

        window.quizBank = [];
        try {
          window.quizBank = await fetchQuizBankBab(babId);
          if (window.quizBank.length === 0 && window.currentBab) {
            var fasalRes = await fetch(SUPABASE_URL + 'rest/v1/fasal?bab_id=eq.' + babId + '&select=id', {
              headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + getToken() }
            });
            var fasals = await fasalRes.json();
            for (var f of fasals) {
              var fQuizzes = await fetchQuizBank(f.id);
              window.quizBank = window.quizBank.concat(fQuizzes);
            }
          }
        } catch(e) { console.error('quiz fetch error', e); }

        if (window.quizBank.length === 0) {
          document.getElementById('startQuizBtn').disabled = true;
          document.getElementById('startQuizBtn').classList.add('opacity-50', 'cursor-not-allowed');
          document.getElementById('startQuizBtn').innerHTML = '<i class="fa-solid fa-lock"></i> Belum Ada Evaluasi';
        }

        // Load prev/next bab for swipe navigation
        await loadPrevNextBab(babId);
      } catch(err) {
        document.getElementById('fasalContent').innerHTML = '<div style="text-align:center;padding:48px;color:#ef4444;"><i class="fa-solid fa-exclamation-triangle"></i> Gagal memuat: ' + err.message + '</div>';
      }
    }

    async function loadPrevNextBab(babId) {
      try {
        var babRes = await fetch(SUPABASE_URL + 'rest/v1/bab?id=eq.' + babId + '&select=*,bagian(*,kitab_id)', {
          headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + getToken() }
        });
        var babs = await babRes.json();
        if (babs.length === 0) return;
        var currentBab = babs[0];
        var kitabId = currentBab.bagian.kitab_id;
        var currentOrder = currentBab.order_index;
        var currentBagianOrder = currentBab.bagian.order_index;

        // Get previous bab (same bagian first, then previous bagian)
        var prevBabRes = await fetch(SUPABASE_URL + 'rest/v1/bab?bagian_id=eq.' + currentBab.bagian_id + '&order=order_index&limit=1', {
          headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + getToken() }
        });
        var prevBabs = await prevBabRes.json();
        window.prevBabId = null;
        if (prevBabs.length > 0 && prevBabs[0].id !== babId) {
          window.prevBabId = prevBabs[0].id;
        } else {
          // Check previous bagian
          var prevBagianRes = await fetch(SUPABASE_URL + 'rest/v1/bagian?kitab_id=eq.' + kitabId + '&order_index=lt.' + currentBagianOrder + '&order=order_index&limit=1', {
            headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + getToken() }
          });
          var prevBagians = await prevBagianRes.json();
          if (prevBagians.length > 0) {
            var prevLastBabRes = await fetch(SUPABASE_URL + 'rest/v1/bab?bagian_id=eq.' + prevBagians[0].id + '&order=order_index.desc&limit=1', {
              headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + getToken() }
            });
            var prevLastBabs = await prevLastBabRes.json();
            if (prevLastBabs.length > 0) window.prevBabId = prevLastBabs[0].id;
          }
        }

        // Get next bab
        var nextBabRes = await fetch(SUPABASE_URL + 'rest/v1/bab?bagian_id=eq.' + currentBab.bagian_id + '&order_index=gt.' + currentOrder + '&order=order_index&limit=1', {
          headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + getToken() }
        });
        var nextBabs = await nextBabRes.json();
        window.nextBabId = null;
        if (nextBabs.length > 0) {
          window.nextBabId = nextBabs[0].id;
        } else {
          // Check next bagian
          var nextBagianRes = await fetch(SUPABASE_URL + 'rest/v1/bagian?kitab_id=eq.' + kitabId + '&order_index=gt.' + currentBagianOrder + '&order=order_index&limit=1', {
            headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + getToken() }
          });
          var nextBagians = await nextBagianRes.json();
          if (nextBagians.length > 0) {
            var nextFirstBabRes = await fetch(SUPABASE_URL + 'rest/v1/bab?bagian_id=eq.' + nextBagians[0].id + '&order=order_index&limit=1', {
              headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + getToken() }
            });
            var nextFirstBabs = await nextFirstBabRes.json();
            if (nextFirstBabs.length > 0) window.nextBabId = nextFirstBabs[0].id;
          }
        }

        // Update next button text
        var nextBtn = document.getElementById('nextFasalBtn');
        if (nextBtn) {
          nextBtn.innerHTML = window.nextBabId ? '<i class="fa-solid fa-arrow-right"></i>下一个' : '<i class="fa-solid fa-flag-checkered"></i>完成';
        }
      } catch(e) { console.error('loadPrevNextBab error:', e); }
    }

    async function loadFasal(fasalId) {
      try {
        var fasal = await fetchFasal(fasalId);
        if (!fasal) { window.location.href = 'student.html'; return; }
        window.currentFasal = fasal;

        try {
          var audioRes = await fetch(SUPABASE_URL + 'rest/v1/fasal?id=eq.' + fasalId + '&select=audio_url', {
            headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + getToken() }
          });
          var audioData = await audioRes.json();
          if (audioData.length > 0 && audioData[0].audio_url) {
            window.currentFasal.audio_url = audioData[0].audio_url;
          }
        } catch(e) {}

        var bagianOrder = 1, babOrder = 1, babTitle = 'Bab';
        if (fasal.bab) {
          var bab = fasal.bab;
          babOrder = bab.order_index;
          babTitle = bab.title || bab.nama || 'Bab ' + bab.order_index;
          if (bab.bagian) bagianOrder = bab.bagian.order_index;
        }

        document.getElementById('breadcrumbKitab').textContent = 'Kitab Mukhtarat';
        document.getElementById('breadcrumbBagian').textContent = 'Bagian ' + bagianOrder;
        document.getElementById('breadcrumbBab').textContent = 'Bab ' + babOrder;
        document.getElementById('breadcrumbFasal').textContent = fasal.title || 'Fasal';
        document.getElementById('fasalTitle').textContent = fasal.title || 'Fasal';
        document.getElementById('fasalNumber').textContent = bagianOrder + '.' + babOrder + '.' + fasal.order_index;
        document.getElementById('fasalType').textContent = 'FASAL';
        document.getElementById('fasalType').className = 'badge badge-blue';
        document.getElementById('fasalBab').textContent = babTitle + ' dari Bagian ' + bagianOrder;

        var content = fasal.content_arab && fasal.content_arab.trim()
          ? fasal.content_arab
          : '<div style="text-align:center;padding:48px 24px;background:#fef3c7;border-radius:16px;border:1px solid #fcd34d;margin:8px 0;"><i class="fa-solid fa-file-import" style="font-size:2rem;color:#d97706;margin-bottom:12px;display:block;"></i><p style="font-size:1rem;font-weight:600;color:#92400e;margin-bottom:4px;">Konten belum tersedia</p><p style="font-size:0.8rem;color:#b45309;">Admin perlu menambahkan materi Arab terlebih dahulu.</p></div>';
        document.getElementById('fasalContent').innerHTML = content;

        if (fasal.content_id) {
          document.getElementById('translationSection').classList.remove('hidden');
          document.getElementById('fasalTranslation').innerHTML = fasal.content_id;
        }

        var progress = null;
        try { progress = await fetchFasalProgress(fasalId); } catch(e) {}
        updateStatus(progress);

        window.quizBank = [];
        try { window.quizBank = await fetchQuizBank(fasalId); } catch(e) {}

        if (window.quizBank.length === 0) {
          document.getElementById('startQuizBtn').disabled = true;
          document.getElementById('startQuizBtn').classList.add('opacity-50', 'cursor-not-allowed');
          document.getElementById('startQuizBtn').innerHTML = '<i class="fa-solid fa-lock"></i> Belum Ada Evaluasi';
        }

        if (window.currentFasal && window.currentFasal.audio_url) {
          initStudentAudioPlayer(window.currentFasal.audio_url);
        }
      } catch(err) {
        document.getElementById('fasalContent').innerHTML = '<div style="text-align:center;padding:48px;color:#ef4444;"><i class="fa-solid fa-exclamation-triangle"></i> Gagal memuat: ' + err.message + '</div>';
      }
    }

    function updateStatus(progress) {
      var statusEl = document.getElementById('fasalStatus');
      if (!progress) {
        statusEl.className = 'header-status';
        statusEl.innerHTML = '<i class="fa-regular fa-circle"></i><span>Belum Dimulai</span>';
      } else if (progress.status === 'completed') {
        statusEl.className = 'header-status badge badge-success';
        statusEl.innerHTML = '<i class="fa-solid fa-check"></i><span>Lulus (' + progress.quiz_score + '%)</span>';
      } else if (progress.status === 'unlocked') {
        statusEl.className = 'header-status badge badge-amber';
        statusEl.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Sedang Dikerjakan</span>';
      } else {
        statusEl.className = 'header-status';
        statusEl.innerHTML = '<i class="fa-regular fa-circle"></i><span>Belum Dimulai</span>';
      }
    }

    async function handleQuizComplete(passed, score, correct, total) {
      console.log('handleQuizComplete called:', {passed, score, correct, total});
      var id = window.currentFasal ? window.currentFasal.id : (window.currentBab ? window.currentBab.id : null);
      console.log('current id:', id);
      if (!id) return;
      var attempts = 1;
      var existing = null;
      try { existing = await fetchFasalProgress(id); } catch(e) {}
      console.log('existing progress:', existing);
      if (existing) attempts = (existing.quiz_attempts || 0) + 1;

      // Get kitab and bab IDs
      var kitabId = window.currentKitabId || (window.currentBab ? window.currentBab.kitab_id : null);
      var babId = window.currentBab ? window.currentBab.id : null;
      console.log('kitabId:', kitabId, 'babId:', babId);

      await saveProgress(id, score, attempts, passed ? 'completed' : 'unlocked', kitabId, babId);
      updateStatus({ status: passed ? 'completed' : 'unlocked', quiz_score: score });
    }

    function handleLogout() { logout(); window.location.href = 'auth.html'; }

    // ================================================================
    // AUDIO PLAYER
    // ================================================================
    var studentAudio = null, studentAudioUrl = null, isStudentAudioPlaying = false;

    function initStudentAudioPlayer(audioUrl) {
      if (!audioUrl) { document.getElementById('audioPlayerSection').classList.add('hidden'); return; }
      studentAudioUrl = audioUrl;
      document.getElementById('audioPlayerSection').classList.remove('hidden');
      studentAudio = new Audio(audioUrl);
      studentAudio.addEventListener('loadedmetadata', function() {
        document.getElementById('studentAudioDuration').textContent = formatStudentTime(studentAudio.duration);
        drawStudentWaveform(audioUrl);
      });
      studentAudio.addEventListener('timeupdate', function() {
        var progress = (studentAudio.currentTime / studentAudio.duration) * 100;
        document.getElementById('studentAudioProgressFill').style.width = progress + '%';
        document.getElementById('studentAudioCurrentTime').textContent = formatStudentTime(studentAudio.currentTime);
      });
      studentAudio.addEventListener('ended', function() {
        isStudentAudioPlaying = false;
        document.getElementById('studentAudioPlayBtn').innerHTML = '<i class="fa-solid fa-play"></i>';
        document.getElementById('studentAudioPlayBtn').classList.remove('playing');
        document.getElementById('studentAudioProgressFill').style.width = '0%';
      });
    }

    function toggleStudentAudio() {
      if (!studentAudio) return;
      if (isStudentAudioPlaying) {
        studentAudio.pause();
        document.getElementById('studentAudioPlayBtn').innerHTML = '<i class="fa-solid fa-play"></i>';
        document.getElementById('studentAudioPlayBtn').classList.remove('playing');
      } else {
        studentAudio.play();
        document.getElementById('studentAudioPlayBtn').innerHTML = '<i class="fa-solid fa-pause"></i>';
        document.getElementById('studentAudioPlayBtn').classList.add('playing');
      }
      isStudentAudioPlaying = !isStudentAudioPlaying;
    }

    function seekStudentAudio(event) {
      if (!studentAudio) return;
      var rect = event.currentTarget.getBoundingClientRect();
      studentAudio.currentTime = studentAudio.duration * ((event.clientX - rect.left) / rect.width);
    }

    function formatStudentTime(seconds) {
      if (isNaN(seconds)) return '00:00';
      return String(Math.floor(seconds / 60)).padStart(2, '0') + ':' + String(Math.floor(seconds % 60)).padStart(2, '0');
    }

    async function drawStudentWaveform(audioUrl) {
      var canvas = document.getElementById('studentWaveformCanvas');
      var ctx = canvas.getContext('2d');
      canvas.width = canvas.offsetWidth;
      canvas.height = 64;
      ctx.fillStyle = 'var(--bg-base)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = 'var(--purple)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (var i = 0; i < 60; i++) {
        var height = Math.random() * 40 + 10;
        ctx.fillRect(i * (canvas.width / 60), (canvas.height - height) / 2, 3, height);
      }
    }
  </script>
