<!DOCTYPE html>
<html lang="id" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Materi — MBBA</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%2322c55e' width='32' height='32' rx='6'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-family='Amiri,serif' font-size='20' fill='white'>م</text></svg>">
  <link rel="stylesheet" href="../css/output.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .arabic-text { font-family: 'Amiri', serif; direction: rtl; text-align: right; line-height: 2.5; font-size: 1.3rem; }
    .content-body { font-family: 'Amiri', serif; direction: rtl; text-align: justify; line-height: 2.4; font-size: 1.2rem; }
  </style>
</head>
<body class="bg-slate-50 font-sans min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-50">
    <div class="max-w-3xl mx-auto px-4 md:px-6 h-14 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="student.html" class="p-2 rounded-lg hover:bg-slate-100 text-slate-500">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 bg-primary-600 rounded-lg flex items-center justify-center">
            <span class="text-white font-bold text-sm">م</span>
          </div>
          <span class="font-bold text-slate-800">MBBA</span>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <a id="adminLinkMateri" href="admin.html" class="p-2 rounded-lg hover:bg-amber-50 text-amber-500 hidden" title="Admin Panel">
          <i class="fa-solid fa-gear text-sm"></i>
        </a>
        <button onclick="handleLogout()" class="p-2 rounded-lg hover:bg-red-50 text-slate-400 hover:text-red-500" title="Logout">
          <i class="fa-solid fa-right-from-bracket text-sm"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Breadcrumb -->
  <div class="bg-white border-b border-slate-100">
    <div class="max-w-3xl mx-auto px-4 md:px-6 py-4">
      <div class="flex items-center gap-2 text-sm text-slate-500 flex-wrap">
        <a href="student.html" class="hover:text-primary-600 flex items-center gap-1">
          <i class="fa-solid fa-home"></i>
          <span>Dashboard</span>
        </a>
        <i class="fa-solid fa-chevron-right text-xs text-slate-300"></i>
        <span id="breadcrumbKitab" class="text-primary-700 font-semibold">Kitab Mukhtarat</span>
      </div>
      <div class="flex items-center gap-2 text-sm text-slate-400 mt-1 ml-6 flex-wrap">
        <i class="fa-solid fa-chevron-right text-xs"></i>
        <span id="breadcrumbBagian">Bagian 1</span>
        <i class="fa-solid fa-chevron-right text-xs"></i>
        <span id="breadcrumbBab">Bab 1</span>
        <i class="fa-solid fa-chevron-right text-xs"></i>
        <span id="breadcrumbFasal" class="text-slate-700 font-medium">Muqoddimah</span>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <main class="max-w-3xl mx-auto px-4 md:px-6 py-6">

    <!-- Header Card -->
    <div class="bg-white rounded-xl border border-slate-200 p-6 mb-6">
      <div class="flex items-start justify-between mb-4">
        <div>
          <div class="flex items-center gap-2 mb-2">
            <span id="fasalNumber" class="text-xs bg-primary-100 text-primary-700 px-2 py-1 rounded font-semibold">1.1</span>
            <span id="fasalType" class="text-xs bg-amber-100 text-amber-700 px-2 py-1 rounded font-semibold">Muqoddimah</span>
          </div>
          <h1 id="fasalTitle" class="text-xl md:text-2xl font-bold text-slate-800">Memuat...</h1>
          <p id="fasalBab" class="text-sm text-slate-500 mt-1">Memuat...</p>
        </div>
        <div id="fasalStatus" class="px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-500">
          -
        </div>
      </div>
    </div>

    <!-- Content -->
    <div class="bg-white rounded-xl border border-slate-200 p-6 mb-6">
      <h2 class="text-lg font-semibold text-slate-800 mb-4">
        <i class="fa-solid fa-book text-primary-500 mr-2"></i>
        Konten Materi
      </h2>
      <div id="fasalContent" class="arabic-text content-body min-h-[200px] text-slate-700">
        <div class="text-center py-8">
          <i class="fa-solid fa-spinner fa-spin text-2xl text-slate-300 mb-2"></i>
          <p class="text-slate-400">Memuat konten...</p>
        </div>
      </div>
    </div>

    <!-- Translation -->
    <div id="translationSection" class="bg-white rounded-xl border border-slate-200 p-6 mb-6 hidden">
      <h2 class="text-lg font-semibold text-slate-800 mb-4">
        <i class="fa-solid fa-language text-blue-500 mr-2"></i>
        Terjemahan
      </h2>
      <div id="fasalTranslation" class="prose prose-slate max-w-none text-slate-600 leading-relaxed">
      </div>
    </div>

    <!-- Quiz Action -->
    <div class="bg-white rounded-xl border border-slate-200 p-6">
      <div class="flex flex-col md:flex-row items-center justify-between gap-4">
        <div>
          <h3 class="font-semibold text-slate-800">Quiz</h3>
          <p class="text-sm text-slate-500">Jawab pertanyaan untuk menyelesaikan materi ini</p>
        </div>
        <div class="flex gap-3">
          <a href="student.html" class="px-6 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-lg transition">
            <i class="fa-solid fa-list mr-2"></i>Daftar Materi
          </a>
          <button onclick="startQuiz()" id="startQuizBtn"
            class="px-6 py-2.5 bg-primary-600 hover:bg-primary-700 text-white font-semibold rounded-lg transition">
            <i class="fa-solid fa-play mr-2"></i>Mulai Quiz
          </button>
        </div>
      </div>
    </div>

  </main>

  <!-- Quiz Modal -->
  <div id="quizModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
      <div class="sticky top-0 bg-white border-b border-slate-200 p-4 flex items-center justify-between">
        <h2 class="text-lg font-semibold text-slate-800">
          <i class="fa-solid fa-question-circle text-primary-500 mr-2"></i>
          Quiz <span id="quizFasalName"></span>
        </h2>
        <button onclick="closeQuiz()" class="p-2 hover:bg-slate-100 rounded-lg text-slate-400">
          <i class="fa-solid fa-times"></i>
        </button>
      </div>
      <div id="quizContent" class="p-6"></div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script src="../js/quiz.js"></script>
  <script>
    var currentFasal = null;
    var currentBab = null;
    var quizBank = [];

    var urlParams = new URLSearchParams(window.location.search);
    var fasalId = urlParams.get('id');
    var babId = urlParams.get('bab');

    (async function() {
      var user = await getCurrentUser();
      if (!user) {
        window.location.href = 'auth.html';
        return;
      }
      var role = (user.user_metadata && user.user_metadata.role) || 'student';
      if (role === 'admin' || role === 'teacher') {
        document.getElementById('adminLinkMateri').classList.remove('hidden');
      }
      if (babId) {
        await loadBab(babId);
      } else if (fasalId) {
        await loadFasal(fasalId);
      } else {
        alert('ID tidak ditemukan');
        window.location.href = 'student.html';
      }
    })();

    async function loadBab(babId) {
      try {
        var res = await fetch(SUPABASE_URL + 'rest/v1/bab?id=eq.' + babId + '&select=*,bagian(*)', {
          headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + getToken() }
        });
        var data = await res.json();
        var bab = data[0];

        if (!bab) {
          alert('Bab tidak ditemukan');
          window.location.href = 'student.html';
          return;
        }

        currentBab = bab;

        // Update breadcrumb - full hierarchy
        document.getElementById('breadcrumbKitab').textContent = 'Kitab Mukhtarat';
        document.getElementById('breadcrumbBagian').textContent = 'Bagian ' + (bab.bagian ? bab.bagian.order_index : 1);
        document.getElementById('breadcrumbBab').textContent = 'Bab ' + bab.order_index;
        document.getElementById('breadcrumbFasal').textContent = bab.title || 'Muqoddimah';

        // Update header
        document.getElementById('fasalTitle').textContent = bab.title || 'Muqoddimah';
        document.getElementById('fasalNumber').textContent = (bab.bagian ? bab.bagian.order_index : 1) + '.' + bab.order_index;
        document.getElementById('fasalType').textContent = 'Muqoddimah';
        document.getElementById('fasalType').className = 'text-xs bg-amber-100 text-amber-700 px-2 py-1 rounded font-semibold';
        document.getElementById('fasalBab').textContent = 'Bab ' + bab.order_index + ' dari Bagian ' + (bab.bagian ? bab.bagian.order_index : 1);

        // Load content
        var content = bab.content_arab || '<p class="text-center text-slate-400">Konten belum tersedia</p>';
        document.getElementById('fasalContent').innerHTML = content;

        // Load translation
        if (bab.content_id) {
          document.getElementById('translationSection').classList.remove('hidden');
          document.getElementById('fasalTranslation').innerHTML = bab.content_id;
        }

        // Check progress
        var progress = null;
        try {
          progress = await fetchBabProgress(babId);
        } catch (e) {
          console.warn('Bab progress fetch skipped:', e.message);
        }
        updateStatus(progress);

        // Load quiz for bab
        console.log('Loading quiz for bab:', babId);
        quizBank = [];
        try {
          // First try bab_id
          quizBank = await fetchQuizBankBab(babId);
          console.log('Quiz by bab_id:', quizBank.length);

          // If no quiz by bab_id, try fasal_id (if bab has fasals)
          if (quizBank.length === 0 && currentBab) {
            console.log('No quiz by bab_id, trying fasals...');
            // Try to get quizzes from associated fasals
            const fasalRes = await fetch(
              `${SUPABASE_URL}rest/v1/fasal?bab_id=eq.${babId}&select=id`,
              { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + getToken() } }
            );
            const fasals = await fasalRes.json();
            console.log('Fasals in this bab:', fasals.length);

            for (var f of fasals) {
              var fQuizzes = await fetchQuizBank(f.id);
              quizBank = quizBank.concat(fQuizzes);
              console.log('Quiz from fasal', f.id, ':', fQuizzes.length);
            }
          }
          console.log('Total quiz bank:', quizBank.length);
        } catch (e) {
          console.error('Quiz load error:', e);
        }

        if (quizBank.length === 0) {
          document.getElementById('startQuizBtn').disabled = true;
          document.getElementById('startQuizBtn').classList.add('opacity-50', 'cursor-not-allowed');
          document.getElementById('startQuizBtn').innerHTML = '<i class="fa-solid fa-lock mr-2"></i>Belum Ada Quiz';
          console.log('No quiz found for bab_id:', babId);
        } else {
          console.log('Quiz found! Button should be active');
        }

      } catch (err) {
        console.error('Error:', err);
        document.getElementById('fasalContent').innerHTML = '<p class="text-red-500">Gagal memuat: ' + err.message + '</p>';
      }
    }

    async function loadFasal(fasalId) {
      try {
        var fasal = await fetchFasal(fasalId);
        if (!fasal) {
          alert('Fasal tidak ditemukan');
          window.location.href = 'student.html';
          return;
        }

        currentFasal = fasal;

        // Get bab and bagian info
        var bagianOrder = 1;
        var babOrder = 1;
        var babTitle = 'Bab';

        if (fasal.bab) {
          var bab = fasal.bab;
          babOrder = bab.order_index;
          babTitle = bab.title || bab.nama || 'Bab ' + bab.order_index;
          if (bab.bagian) {
            bagianOrder = bab.bagian.order_index;
          }
        }

        // Update breadcrumb - full hierarchy
        document.getElementById('breadcrumbKitab').textContent = 'Kitab Mukhtarat';
        document.getElementById('breadcrumbBagian').textContent = 'Bagian ' + bagianOrder;
        document.getElementById('breadcrumbBab').textContent = 'Bab ' + babOrder;
        document.getElementById('breadcrumbFasal').textContent = fasal.title || 'Fasal';

        // Update header
        document.getElementById('fasalTitle').textContent = fasal.title || 'Fasal';
        document.getElementById('fasalNumber').textContent = bagianOrder + '.' + babOrder + '.' + fasal.order_index;
        document.getElementById('fasalType').textContent = 'Fasal';
        document.getElementById('fasalType').className = 'text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded font-semibold';
        document.getElementById('fasalBab').textContent = babTitle + ' dari Bagian ' + bagianOrder;

        // Load content
        var content = fasal.content_arab || '<p class="text-center text-slate-400">Konten belum tersedia</p>';
        document.getElementById('fasalContent').innerHTML = content;

        // Load translation
        if (fasal.content_id) {
          document.getElementById('translationSection').classList.remove('hidden');
          document.getElementById('fasalTranslation').innerHTML = fasal.content_id;
        }

        // Check progress
        var progress = null;
        try {
          progress = await fetchFasalProgress(fasalId);
        } catch (e) {
          console.error('Error fetching progress:', e);
        }
        updateStatus(progress);

        // Load quiz
        console.log('Loading quiz for fasal:', fasalId);
        quizBank = [];
        try {
          quizBank = await fetchQuizBank(fasalId);
          console.log('Quiz bank loaded:', quizBank.length, 'questions');
        } catch (e) {
          console.error('Error loading quiz:', e);
        }
        console.log('Quiz bank data:', quizBank);

        if (quizBank.length === 0) {
          document.getElementById('startQuizBtn').disabled = true;
          document.getElementById('startQuizBtn').classList.add('opacity-50', 'cursor-not-allowed');
          document.getElementById('startQuizBtn').innerHTML = '<i class="fa-solid fa-lock mr-2"></i>Belum Ada Quiz';
          console.log('No quiz found for fasal_id:', fasalId);
        } else {
          console.log('Quiz found! Button should be active');
        }

      } catch (err) {
        console.error('Error:', err);
        document.getElementById('fasalContent').innerHTML = '<p class="text-red-500">Gagal memuat: ' + err.message + '</p>';
      }
    }

    function updateStatus(progress) {
      var statusEl = document.getElementById('fasalStatus');
      if (!progress) {
        statusEl.className = 'px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-500';
        statusEl.textContent = 'Belum Dimulai';
      } else if (progress.status === 'completed') {
        statusEl.className = 'px-3 py-1 rounded-full text-xs font-semibold bg-green-100 text-green-700';
        statusEl.textContent = 'Lulus (' + progress.quiz_score + '%)';
      } else {
        statusEl.className = 'px-3 py-1 rounded-full text-xs font-semibold bg-amber-100 text-amber-700';
        statusEl.textContent = 'Sedang Dikerjakan';
      }
    }

    var quizQuestions = [];
    var currentQuestionIndex = 0;
    var selectedAnswers = {};
    var quizBankLoaded = [];

    function startQuiz() {
      console.log('startQuiz called');
      console.log('quizBank length:', quizBank.length);
      console.log('quizBank:', quizBank);

      if (quizBank.length === 0) {
        alert('Belum ada quiz');
        return;
      }
      document.getElementById('quizModal').classList.remove('hidden');

      var quizId = currentFasal ? currentFasal.id : ('bab_' + currentBab.id);
      var quizTitle = currentFasal ? currentFasal.title : currentBab.title;
      var quizCount = (currentFasal && currentFasal.quiz_count) || 10;

      // Initialize quiz from quiz.js
      initQuiz(quizBank, quizId, quizCount, {
        onPass: function(score, correct, total, results) {
          handleQuizComplete(true, score, correct, total);
        },
        onFail: function(score, correct, total, results) {
          handleQuizComplete(false, score, correct, total);
        }
      });

      quizBankLoaded = quizBank;
      quizQuestions = window._quizState.questions;
      currentQuestionIndex = 0;
      selectedAnswers = {};
      renderQuestion();
    }

    function renderQuestion() {
      var state = window._quizState;
      if (!state || !state.questions || state.questions.length === 0) {
        document.getElementById('quizContent').innerHTML = '<p class="text-red-500">Quiz tidak tersedia</p>';
        return;
      }

      var q = state.questions[currentQuestionIndex];
      var container = document.getElementById('quizContent');
      var answers = state.selectedAnswers || {};

      container.innerHTML = '<div class="mb-4 text-sm text-slate-500">Soal ' + (currentQuestionIndex + 1) + ' dari ' + state.questions.length + '</div>';

      var qText = q.type === 'mc' ? q.question : q.question;
      container.innerHTML += '<div class="mb-6 p-4 bg-slate-50 rounded-lg"><p class="text-lg font-medium text-slate-800">' + qText + '</p></div>';

      if (q.type === 'mc' && q.options) {
        var opts;
        try {
          var parsed = JSON.parse(q.options);
          // Check if it's an array (new format) or object (old format)
          if (Array.isArray(parsed)) {
            opts = {};
            parsed.forEach(function(item) {
              opts[item.key] = item.value;
            });
          } else {
            opts = parsed;
          }
        } catch (e) {
          console.error('Failed to parse options:', e);
          opts = {};
        }
        container.innerHTML += '<div class="space-y-3">';
        for (var key in opts) {
          var isSelected = answers[q.id] === key;
          container.innerHTML += '<label class="flex items-center gap-3 p-3 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-50' + (isSelected ? ' border-primary-500 bg-primary-50' : '') + '">' +
            '<input type="radio" name="answer" value="' + key + '" ' + (isSelected ? 'checked' : '') + ' onchange="selectAnswer(\'' + q.id + '\', \'' + key + '\')" class="w-4 h-4 text-primary-600">' +
            '<span class="font-semibold text-slate-600">' + key + '.</span><span>' + opts[key] + '</span></label>';
        }
        container.innerHTML += '</div>';
      } else {
        container.innerHTML += '<div class="mb-4"><input type="text" id="answerInput" value="' + (answers[q.id] || '') + '" oninput="setAnswer(\'' + q.id + '\', this.value)" class="w-full px-4 py-3 border border-slate-200 rounded-lg text-lg focus:outline-none focus:ring-2 focus:ring-primary-500" placeholder="Ketik jawaban..."></div>';
      }

      var prevBtn = currentQuestionIndex === 0 ? 'disabled' : '';
      var prevClass = currentQuestionIndex === 0 ? 'opacity-50 cursor-not-allowed' : '';
      container.innerHTML += '<div class="flex justify-between mt-6">' +
        '<button onclick="prevQuestion()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-lg ' + prevClass + '" ' + prevBtn + '><i class="fa-solid fa-chevron-left mr-1"></i>Prev</button>';

      if (currentQuestionIndex < state.questions.length - 1) {
        container.innerHTML += '<button onclick="nextQuestion()" class="px-6 py-2 bg-primary-600 hover:bg-primary-700 text-white rounded-lg">Next <i class="fa-solid fa-chevron-right ml-1"></i></button>';
      } else {
        container.innerHTML += '<button onclick="submitQuiz()" class="px-6 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg">Submit <i class="fa-solid fa-check ml-1"></i></button>';
      }
      container.innerHTML += '</div>';

      container.innerHTML += '<div class="flex justify-center gap-2 mt-6">';
      state.questions.forEach(function(qi, i) {
        var isAnswered = answers[qi.id] ? true : false;
        var dotClass = i === currentQuestionIndex ? 'bg-primary-600' : (isAnswered ? 'bg-green-500' : 'bg-slate-300');
        container.innerHTML += '<button onclick="goToQuestion(' + i + ')" class="w-3 h-3 rounded-full ' + dotClass + '"></button>';
      });
      container.innerHTML += '</div>';
    }

    function selectAnswer(qid, ans) {
      setAnswer(qid, ans);
      renderQuestion();
    }

    function prevQuestion() {
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        renderQuestion();
      }
    }

    function nextQuestion() {
      if (currentQuestionIndex < quizQuestions.length - 1) {
        currentQuestionIndex++;
        renderQuestion();
      }
    }

    function goToQuestion(index) {
      currentQuestionIndex = index;
      renderQuestion();
    }

    function submitQuiz() {
      var result;
      try {
        result = submitQuiz();
      } catch (e) {
        console.error('Quiz submit error:', e);
        alert('Gagal submit quiz. Silakan coba lagi.');
        return;
      }
      var container = document.getElementById('quizContent');

      var icon = result.passed ? 'fa-check-circle text-green-500' : 'fa-times-circle text-red-500';
      var title = result.passed ? 'Selamat!' : 'Belum Lulus';
      var msg = result.passed ? 'Anda menjawab 100% benar!' : 'Skor: ' + result.score + '%. Syarat: 100%';

      container.innerHTML = '<div class="text-center py-8">' +
        '<i class="fa-solid ' + icon + ' text-6xl mb-4"></i>' +
        '<h3 class="text-2xl font-bold text-slate-800 mb-2">' + title + '</h3>' +
        '<p class="text-slate-500 mb-6">' + msg + '</p>' +
        '<p class="text-lg mb-6">' + result.correct + ' dari ' + result.total + ' benar</p>';

      if (result.passed) {
        container.innerHTML += '<button onclick="closeQuiz(); window.location.href=\'student.html\';" class="px-6 py-2.5 bg-primary-600 hover:bg-primary-700 text-white font-semibold rounded-lg"><i class="fa-solid fa-home mr-2"></i>Kembali ke Dashboard</button>';
      } else {
        container.innerHTML += '<button onclick="retryQuiz()" class="px-6 py-2.5 bg-amber-500 hover:bg-amber-600 text-white font-semibold rounded-lg mr-2"><i class="fa-solid fa-redo mr-2"></i>Coba Lagi</button>';
        container.innerHTML += '<button onclick="closeQuiz()" class="px-6 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold rounded-lg">Kembali</button>';
      }
      container.innerHTML += '</div>';
    }

    async function handleQuizComplete(passed, score, correct, total) {
      var id = currentFasal ? currentFasal.id : ('bab_' + currentBab.id);
      var attempts = 1;
      var existing = null;
      try {
        existing = await fetchFasalProgress(id);
      } catch (e) {}
      if (existing) attempts = (existing.quiz_attempts || 0) + 1;
      await saveProgress(id, score, attempts, passed ? 'completed' : 'unlocked');
      updateStatus({ status: passed ? 'completed' : 'unlocked', quiz_score: score });
    }

    function retryQuiz() {
      if (quizBankLoaded.length === 0) {
        quizBankLoaded = quizBank;
      }
      resetQuiz(quizBankLoaded);
      quizQuestions = window._quizState.questions;
      currentQuestionIndex = 0;
      selectedAnswers = {};
      renderQuestion();
    }

    function closeQuiz() {
      document.getElementById('quizModal').classList.add('hidden');
    }

    function handleLogout() {
      logout();
      window.location.href = 'auth.html';
    }
  </script>
</body>
