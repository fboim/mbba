<!DOCTYPE html>
<html lang="id" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — MBBA</title>
  <link rel="icon" href="../img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg-base: #F8F9FA;
      --bg-card: #FFFFFF;
      --text-primary: #1A1D23;
      --text-secondary: #4A5568;
      --text-muted: #94A3B8;
      --border-subtle: rgba(0, 0, 0, 0.06);
      --border-soft: rgba(0, 0, 0, 0.08);
      --accent: #059669;
      --accent-light: #10B981;
      --accent-soft: #ECFDF5;
      --accent-glow: rgba(5, 150, 105, 0.15);
      --amber-soft: #FFFBEB;
      --blue: #3B82F6;
      --blue-soft: #EFF6FF;
      --purple: #8B5CF6;
      --purple-soft: #F5F3FF;
      --red: #EF4444;
      --red-soft: #FEE2E2;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.02), 0 4px 8px rgba(0,0,0,0.02);
      --shadow-md: 0 2px 4px rgba(0,0,0,0.02), 0 8px 16px rgba(0,0,0,0.03);
      --shadow-lg: 0 4px 8px rgba(0,0,0,0.03), 0 16px 32px rgba(0,0,0,0.04);
      --radius-sm: 16px;
      --radius-md: 20px;
      --radius-lg: 28px;
      --radius-xl: 36px;
    }

    .dark {
      --bg-base: #0C0E14;
      --bg-card: #141820;
      --text-primary: #F1F5F9;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --border-subtle: rgba(255, 255, 255, 0.04);
      --border-soft: rgba(255, 255, 255, 0.08);
      --accent-soft: rgba(5, 150, 105, 0.12);
      --accent-glow: rgba(16, 185, 129, 0.2);
      --amber-soft: rgba(245, 158, 11, 0.12);
      --blue-soft: rgba(59, 130, 246, 0.12);
      --purple-soft: rgba(139, 92, 246, 0.12);
      --red-soft: rgba(239, 68, 68, 0.12);
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.2), 0 4px 8px rgba(0,0,0,0.15);
      --shadow-md: 0 2px 4px rgba(0,0,0,0.25), 0 8px 16px rgba(0,0,0,0.2);
      --shadow-lg: 0 4px 8px rgba(0,0,0,0.3), 0 16px 32px rgba(0,0,0,0.25);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Montserrat', system-ui, -apple-system, sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background 0.3s ease, color 0.3s ease;
    }

    ::selection { background: var(--accent-soft); color: var(--accent); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-soft); border-radius: 3px; }

    /* Arabic Typography */
    .arabic {
      font-family: 'Amiri', serif;
      direction: rtl;
      text-align: right;
      line-height: 2.4;
      letter-spacing: 0.01em;
    }
    .arabic-xs { font-size: 1.05rem; line-height: 2.2; }
    .arabic-sm { font-size: 1.25rem; line-height: 2.4; }
    .arabic-md { font-size: 1.5rem; line-height: 2.6; }
    .arabic-lg { font-size: 1.85rem; line-height: 2.8; }
    .arabic-xl { font-size: 2.25rem; line-height: 3; }

    /* Navigation */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(248, 249, 250, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-subtle);
    }
    .dark .nav { background: rgba(12, 14, 20, 0.9); }
    .nav-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: var(--text-primary);
    }
    .nav-logo-icon {
      width: 46px;
      height: 46px;
      background: linear-gradient(145deg, var(--accent), var(--accent-light));
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(5, 150, 105, 0.35);
      overflow: hidden;
      padding: 4px;
    }
    .nav-logo-icon img { width: 100%; height: 100%; object-fit: contain; }
    .nav-logo-text { font-weight: 800; font-size: 1.35rem; letter-spacing: -0.03em; }
    .nav-right { display: flex; align-items: center; gap: 10px; }
    .user-name { display: none; font-size: 0.875rem; font-weight: 500; color: var(--text-muted); }
    @media (min-width: 640px) { .user-name { display: block; } }
    .nav-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      border-radius: 14px;
      border: 1px solid var(--border-soft);
      background: var(--bg-card);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.25s ease;
      text-decoration: none;
    }
    .nav-btn:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .nav-btn.admin-btn:hover { border-color: var(--purple); color: var(--purple); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15); }
    .nav-btn.logout-btn:hover { border-color: var(--red); color: var(--red); box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15); }

    /* Main Content */
    .main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 104px 24px 60px;
    }

    /* Bento Grid */
    .bento-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
    }
    @media (min-width: 768px) {
      .bento-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 1024px) {
      .bento-grid { gap: 28px; }
    }
    .bento-span-2 { grid-column: span 1; }
    @media (min-width: 768px) { .bento-span-2 { grid-column: span 2; } }

    /* Bento Card */
    .bento-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .bento-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: var(--border-soft); }

    .bento-inner { padding: 28px; }

    /* Hero Section */
    .hero-title {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }
    .hero-title-accent {
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-subtitle { color: var(--text-muted); font-size: 1.05rem; }

    /* Progress Card */
    .progress-card {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    @media (min-width: 640px) {
      .progress-card { flex-direction: row; align-items: center; }
    }
    .progress-ring-container {
      position: relative;
      width: 130px;
      height: 130px;
      margin: 0 auto;
    }
    @media (min-width: 640px) {
      .progress-ring-container { width: 150px; height: 150px; margin: 0; flex-shrink: 0; }
    }
    .progress-ring { transform: rotate(-90deg); }
    .progress-ring-bg { fill: none; stroke: var(--border-subtle); stroke-width: 12; }
    .progress-ring-fill { fill: none; stroke: url(#progressGradient); stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset 1s ease-out; }
    .progress-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .progress-percent { font-size: 2.2rem; font-weight: 800; color: var(--accent); line-height: 1; }
    .progress-label { font-size: 0.65rem; color: var(--text-muted); margin-top: 4px; }
    .progress-stats { flex: 1; }
    .progress-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 6px; }
    .progress-desc { color: var(--text-muted); font-size: 0.875rem; margin-bottom: 16px; }
    .stats-mini { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .stat-mini { background: var(--bg-base); padding: 12px; border-radius: 14px; text-align: center; }
    .stat-mini-value { font-size: 1.4rem; font-weight: 800; }
    .stat-mini-value.green { color: var(--accent); }
    .stat-mini-value.blue { color: var(--blue); }
    .stat-mini-value.amber { color: #F59E0B; }
    .stat-mini-label { font-size: 0.65rem; color: var(--text-muted); margin-top: 3px; }

    /* Continue Section */
    .continue-card {
      background: linear-gradient(135deg, var(--accent-soft) 0%, rgba(209, 250, 229, 0.3) 100%);
      border-radius: var(--radius-md);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    @media (min-width: 640px) {
      .continue-card { flex-direction: row; align-items: center; }
    }
    .dark .continue-card { background: linear-gradient(135deg, rgba(5, 150, 105, 0.15) 0%, rgba(5, 150, 105, 0.08) 100%); }
    .continue-icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(145deg, var(--accent), var(--accent-light));
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.3rem;
      box-shadow: 0 8px 20px rgba(5, 150, 105, 0.4);
      animation: float 3s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    .continue-content { flex: 1; text-align: center; }
    @media (min-width: 640px) { .continue-content { text-align: left; } }
    .continue-badges { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 6px; }
    @media (min-width: 640px) { .continue-badges { justify-content: flex-start; } }
    .continue-badge { padding: 4px 12px; background: var(--bg-card); color: var(--accent); border-radius: 100px; font-size: 0.65rem; font-weight: 700; }
    .continue-badge-accent { background: var(--accent); color: white; }
    .continue-title { font-weight: 700; font-size: 1.05rem; margin-bottom: 2px; }
    .continue-subtitle { font-size: 0.75rem; color: var(--text-muted); }
    .continue-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      background: linear-gradient(145deg, var(--accent), var(--accent-light));
      color: white;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.875rem;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(5, 150, 105, 0.35);
      transition: all 0.25s ease;
      flex-shrink: 0;
    }
    .continue-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(5, 150, 105, 0.45); }

    /* Section Header */
    .section-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }
    .section-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(145deg, var(--accent-soft), rgba(209, 250, 229, 0.5));
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 1.2rem;
    }
    .dark .section-icon { background: linear-gradient(145deg, rgba(5, 150, 105, 0.2), rgba(5, 150, 105, 0.1)); }
    .section-icon.amber { background: linear-gradient(145deg, var(--amber-soft), rgba(254, 243, 199, 0.5)); color: #F59E0B; }
    .dark .section-icon.amber { background: linear-gradient(145deg, rgba(245, 158, 11, 0.2), rgba(245, 158, 11, 0.1)); }
    .section-title { font-size: 1.2rem; font-weight: 700; }

    /* Timeline */
    .timeline {
      position: relative;
      padding-left: 2rem;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 8px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--border-soft);
      border-radius: 1px;
    }
    .timeline-item { position: relative; margin-bottom: 16px; }
    .timeline-item:last-child { margin-bottom: 0; }
    .timeline-node {
      position: absolute;
      left: -1.45rem;
      top: 12px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 3px solid;
    }
    .timeline-node.completed {
      background: linear-gradient(145deg, var(--accent), var(--accent-light));
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-glow);
    }
    .timeline-node.active {
      background: linear-gradient(145deg, var(--blue), #60A5FA);
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
    .timeline-node.locked { background: var(--bg-base); border-color: var(--border-soft); }
    .dark .timeline-node.locked { background: var(--bg-card); }

    .timeline-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px;
      transition: all 0.25s ease;
    }
    .timeline-card:hover { transform: translateX(6px); box-shadow: var(--shadow-md); }
    .timeline-card.completed { background: linear-gradient(135deg, rgba(5, 150, 105, 0.03), transparent); border-color: rgba(5, 150, 105, 0.15); }
    .timeline-card.active { border-color: rgba(59, 130, 246, 0.3); border-width: 2px; background: linear-gradient(135deg, rgba(59, 130, 246, 0.03), transparent); }
    .timeline-badges { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
    .timeline-badge { padding: 4px 10px; border-radius: 100px; font-size: 0.6rem; font-weight: 700; }
    .timeline-badge.type { background: var(--blue-soft); color: var(--blue); }
    .dark .timeline-badge.type { background: rgba(59, 130, 246, 0.2); color: #60A5FA; }
    .timeline-badge.status { background: rgba(34, 197, 94, 0.1); color: #16a34a; }
    .dark .timeline-badge.status { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .timeline-badge.status.active { background: var(--blue-soft); color: var(--blue); }
    .dark .timeline-badge.status.active { background: rgba(59, 130, 246, 0.2); color: #60A5FA; }
    .timeline-badge.locked { background: var(--bg-base); color: var(--text-muted); }
    .dark .timeline-badge.locked { background: rgba(255,255,255,0.05); }
    .timeline-item-title { font-weight: 600; font-size: 0.95rem; margin-bottom: 2px; }
    .timeline-item.locked .timeline-item-title { color: var(--text-muted); }
    .timeline-item-subtitle { font-size: 0.75rem; color: var(--text-muted); }

    .timeline-actions { display: flex; gap: 8px; margin-top: 12px; }
    .timeline-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .timeline-btn.primary {
      background: linear-gradient(145deg, var(--accent), var(--accent-light));
      color: white;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
    }
    .timeline-btn.primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(5, 150, 105, 0.4); }
    .timeline-btn.secondary { background: var(--bg-base); color: var(--text-secondary); border: 1px solid var(--border-subtle); }
    .dark .timeline-btn.secondary { background: var(--bg-base); color: var(--text-secondary); }
    .timeline-btn.secondary:hover { border-color: var(--accent); color: var(--accent); }
    .timeline-btn.locked { background: var(--bg-base); color: var(--text-muted); cursor: not-allowed; }

    /* Activity Card */
    .activity-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .activity-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(145deg, var(--amber-soft), rgba(254, 243, 199, 0.5));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #F59E0B;
    }
    .dark .activity-icon { background: linear-gradient(145deg, rgba(245, 158, 11, 0.2), rgba(245, 158, 11, 0.1)); }
    .activity-title { font-weight: 700; font-size: 0.95rem; }
    .activity-body { padding: 20px 24px; }
    .activity-empty { text-align: center; padding: 32px; }
    .activity-empty-icon {
      width: 64px;
      height: 64px;
      background: var(--bg-base);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 1.5rem;
      color: var(--text-muted);
    }
    .activity-empty-text { color: var(--text-muted); font-size: 0.875rem; }

    .hidden { display: none !important; }

    /* Kitab Cards */
    .kitab-cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }
    @media (min-width: 768px) {
      .kitab-cards-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 24px; }
    }
    @media (min-width: 1024px) {
      .kitab-cards-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    }
    .kitab-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
    }
    .kitab-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: var(--border-soft); }
    .kitab-card-cover {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      background: linear-gradient(135deg, #f0fdf4, #dcfce7);
      display: block;
    }
    .kitab-card-cover-placeholder {
      width: 100%;
      aspect-ratio: 3/4;
      background: linear-gradient(135deg, #8b5cf6, #a78bfa);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .kitab-card-cover-placeholder i { color: white; font-size: 2rem; opacity: 0.8; }
    .kitab-card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; }
    .kitab-card-title { font-weight: 700; font-size: 1rem; color: var(--text-primary); margin-bottom: 6px; line-height: 1.3; }
    .kitab-card-author { font-size: 0.85rem; color: var(--text-muted); }
    .kitab-card-jenjang { display: inline-block; margin-top: 8px; padding: 4px 12px; background: var(--purple-soft); color: var(--purple); border-radius: 100px; font-size: 0.7rem; font-weight: 700; }
    .dark .kitab-card-jenjang { background: rgba(139,92,246,0.2); }
    .kitab-card-progress { margin-top: auto; padding-top: 12px; height: 6px; background: var(--border-soft); border-radius: 3px; overflow: hidden; }
    .kitab-card-progress-fill { height: 100%; background: linear-gradient(90deg, #059669, #34d399); border-radius: 3px; transition: width 0.5s ease; }
    .kitab-card-btn { display: block; width: 100%; margin-top: 12px; padding: 12px 16px; border-radius: var(--radius-md); font-weight: 600; font-size: 0.85rem; text-align: center; border: none; cursor: pointer; transition: all 0.2s; text-decoration: none; }
    .kitab-card-btn-mulai { background: var(--accent); color: white; }
    .kitab-card-btn-lanjut { background: var(--purple); color: white; }
    .kitab-card-btn:hover { opacity: 0.9; transform: translateY(-1px); }

    /* Modal Styles */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 16px; backdrop-filter: blur(4px); }
    .modal-content { background: var(--bg-card); border-radius: var(--radius-lg); width: 100%; max-width: 600px; max-height: 85vh; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border-subtle); display: flex; align-items: flex-start; justify-content: space-between; }
    .modal-body { padding: 24px; overflow-y: auto; flex: 1; }
    .modal-body h4 { font-size: 1rem; font-weight: 700; color: var(--text-primary); margin: 0 0 12px 0; }
    .modal-body p { color: var(--text-secondary); line-height: 1.6; margin: 0 0 16px 0; }
    .modal-body .arabic-text { font-family: 'Amiri', serif; font-size: 1.3rem; line-height: 2.2; color: var(--text-primary); }

    /* Materi Popup Specific */
    .materi-popup { max-width: 650px; }
    .materi-popup-header { background: var(--bg-secondary); }
    .materi-content-arab { background: linear-gradient(135deg, #fef3c7, #fde68a); padding: 20px; border-radius: var(--radius-md); margin-bottom: 16px; }
    .dark .materi-content-arab { background: linear-gradient(135deg, rgba(253, 230, 138, 0.1), rgba(254, 243, 199, 0.05)); }
    .materi-content-translation { background: var(--bg-secondary); padding: 16px; border-radius: var(--radius-md); border-left: 4px solid var(--accent); }
    .materi-section-label { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }

    /* Quiz Modal Specific */
    .quiz-question-box { background: var(--bg-secondary); padding: 20px; border-radius: var(--radius-md); margin-bottom: 16px; }
    .quiz-question-text { font-size: 1.1rem; font-weight: 600; margin-bottom: 16px; color: var(--text-primary); }
    .quiz-options { display: flex; flex-direction: column; gap: 8px; }
    .quiz-option { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--bg-card); border: 2px solid var(--border-subtle); border-radius: var(--radius-md); cursor: pointer; transition: all 0.2s; }
    .quiz-option:hover { border-color: var(--accent); background: var(--accent-soft); }
    .quiz-option.selected { border-color: var(--accent); background: var(--accent-soft); }
    .quiz-option-key { width: 28px; height: 28px; background: var(--border-soft); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem; }
    .quiz-option.selected .quiz-option-key { background: var(--accent); color: white; }
    .quiz-nav { display: flex; justify-content: space-between; margin-top: 20px; }
    .quiz-progress-dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 20px; flex-wrap: wrap; }
    .quiz-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--border-soft); }
    .quiz-dot.answered { background: var(--accent); }
    .quiz-dot.current { background: var(--purple); transform: scale(1.2); }

    /* Badge styles */
    .badge { display: inline-block; padding: 4px 10px; border-radius: 100px; font-weight: 700; }
    .badge-purple { background: var(--purple-soft); color: var(--purple); }
    .badge-amber { background: var(--amber-soft); color: var(--amber); }
    .badge-green { background: var(--accent-soft); color: var(--accent); }
    .dark .badge-purple { background: rgba(139,92,246,0.2); }

    /* Button styles */
    .btn { padding: 10px 20px; border-radius: var(--radius-md); font-weight: 600; font-size: 0.875rem; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-light)); color: white; }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-secondary { background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border-subtle); }
    .btn-secondary:hover { background: var(--border-soft); }

    /* Jenjang Filter Tabs */
    .jenjang-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .jenjang-tab {
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border-soft);
      background: var(--bg-card);
      color: var(--text-secondary);
      transition: all 0.2s;
    }
    .jenjang-tab:hover { border-color: var(--purple); color: var(--purple); }
    .jenjang-tab.active {
      background: var(--purple);
      color: white;
      border-color: var(--purple);
    }

    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up { animation: fadeInUp 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards; }

    /* Streak Toast */
    .streak-toast {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #f59e0b, #fbbf24);
      color: white;
      padding: 12px 20px;
      border-radius: 100px;
      font-size: 0.875rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.4);
      z-index: 1001;
      animation: slideDown 0.5s ease;
    }
    .streak-toast.hidden { display: none; }
    @keyframes slideDown {
      from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    .streak-toast i { font-size: 1.2rem; }

    /* Badge Container */
    .badge-container {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .badge-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: linear-gradient(135deg, var(--purple), var(--purple-light));
      color: white;
      border-radius: 100px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-item i { font-size: 0.9rem; }

    /* Floating Continue Button */
    .floating-continue {
      position: fixed;
      bottom: 90px;
      right: 20px;
      z-index: 999;
    }
    .floating-continue.hidden { display: none; }
    .floating-continue-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 20px;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      color: white;
      border: none;
      border-radius: 100px;
      font-size: 0.875rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(5, 150, 105, 0.4);
      transition: all 0.3s ease;
    }
    .floating-continue-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(5, 150, 105, 0.5);
    }
    .floating-continue-btn i { font-size: 1rem; }

    /* Mobile Bottom Navigation */
    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg-card);
      border-top: 1px solid var(--border-subtle);
      padding: 8px 0;
      padding-bottom: calc(8px + env(safe-area-inset-bottom));
      z-index: 1000;
    }
    .bottom-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 16px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.65rem;
      font-weight: 600;
      transition: color 0.2s;
    }
    .bottom-nav-item i { font-size: 1.2rem; }
    .bottom-nav-item.active { color: var(--accent); }
    .bottom-nav-item:hover { color: var(--text-primary); }

    /* Celebration Confetti */
    .confetti-piece {
      position: fixed;
      width: 10px;
      height: 10px;
      z-index: 1002;
      animation: confettiFall 3s ease-out forwards;
    }
    @keyframes confettiFall {
      0% { opacity: 1; transform: translateY(0) rotate(0deg); }
      100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
    }

    /* Celebration Toast */
    .celebration-toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      color: white;
      padding: 24px 40px;
      border-radius: var(--radius-lg);
      text-align: center;
      z-index: 1003;
      animation: celebrationPop 0.5s ease;
      box-shadow: 0 8px 40px rgba(5, 150, 105, 0.5);
    }
    .celebration-toast i { font-size: 3rem; margin-bottom: 12px; display: block; }
    .celebration-toast h3 { font-size: 1.5rem; margin: 0 0 8px 0; }
    .celebration-toast p { font-size: 0.9rem; opacity: 0.9; margin: 0; }

    @keyframes celebrationPop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      50% { transform: translate(-50%, -50%) scale(1.1); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    /* Mobile Responsive */
    @media (min-width: 641px) {
      .floating-continue { bottom: 24px; right: 24px; }
    }
    @media (max-width: 640px) {
      .bottom-nav { display: flex; justify-content: space-around; }
      .floating-continue { bottom: 80px; right: 16px; }
      .main { padding-bottom: 80px; }
    }
  </style>
</head>

        <div id="quizStartScreen" style="text-align:center; padding:40px 20px;">
          <div style="width:80px; height:80px; background:linear-gradient(135deg, var(--accent), var(--accent-light)); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px;">
            <i class="fa-solid fa-brain" style="font-size:2rem; color:white;"></i>

          <p style="color:var(--text-muted); margin:0 0 24px 0; font-size:0.9rem;">Jawab semua soal dengan benar 100% untuk bisa lanjut ke materi berikutnya.</p>
          <button id="startQuizBtn" class="btn btn-primary" onclick="startInlineQuiz()">

  <script src="/js/api.js"></script>
  <script>
    var allFasals = [];
    var allBabs = [];
    var userProgress = [];
    var items = [];
    var nextUnlockIndex = 0;

    var allKitabs = [];
    var allJenjangs = [];
    var selectedJenjangId = null;
    var kurikulum = [];
    var currentItemData = null;
    var currentUserData = null;

    (async function() {
      var user = await getCurrentUser();
      if (!user) {
        window.location.href = 'auth.html';
        return;
      }
      setUserRole(user);
      var role = user.user_metadata && user.user_metadata.role || 'student';
      if (role === 'admin' || role === 'teacher') {
        document.getElementById('adminLink').style.display = 'flex';
      }

      // Get user name from users table or auth metadata
      var userName = 'Pelajar';
      var token = getToken();
      var nameHeaders = { 'apikey': SUPABASE_ANON_KEY };
      if (token) nameHeaders['Authorization'] = 'Bearer ' + token;
      try {
        var profileRes = await fetch(SUPABASE_URL + '/rest/v1/users?id=eq.' + user.id + '&select=full_name', { headers: nameHeaders });
        if (profileRes.ok) {
          var profiles = await profileRes.json().catch(() => []);
          if (profiles && profiles.length > 0 && profiles[0].full_name) {
            userName = profiles[0].full_name;
          } else if (user.user_metadata && user.user_metadata.full_name) {
            userName = user.user_metadata.full_name;
          } else if (user.email) {
            userName = user.email.split('@')[0];
          }
        } else if (user.user_metadata && user.user_metadata.full_name) {
          userName = user.user_metadata.full_name;
        }
      } catch(e) {
        if (user.user_metadata && user.user_metadata.full_name) {
          userName = user.user_metadata.full_name;
        } else if (user.email) {
          userName = user.email.split('@')[0];
        }
      }
      document.getElementById('userName').textContent = 'Hai, ' + userName;
      document.getElementById('heroGreeting').textContent = 'Assalamu\'alaikum, ' + userName;

      // Load kitab cards
      await loadKitabCards();

      // Update floating continue button based on progress
      await updateFloatingContinue();

      // Dark Mode with smooth transition
      const themeToggle = document.getElementById('theme-toggle');
      const html = document.documentElement;
      if (localStorage.getItem('mbba-theme') === 'dark' ||
          (!localStorage.getItem('mbba-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        html.classList.add('dark');
        themeToggle.innerHTML = '<i class="fa-solid fa-sun"></i>';
      }
      themeToggle.addEventListener('click', () => {
        html.classList.add('transitioning');
        html.classList.toggle('dark');
        const isDark = html.classList.contains('dark');
        localStorage.setItem('mbba-theme', isDark ? 'dark' : 'light');
        themeToggle.innerHTML = isDark ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
        setTimeout(() => html.classList.remove('transitioning'), 400);
      });
    })();

    async function loadDashboard() {
      try {
        kurikulum = [];
        try {
          kurikulum = await fetchKurikulum();
          console.log('fetchKurikulum result:', JSON.stringify(kurikulum).substring(0, 500));
        } catch(e) {
          console.error('fetchKurikulum error:', e);
          kurikulum = [];
        }
        if (!kurikulum) kurikulum = [];
        allFasals = [];
        allBabs = [];
        items = [];

        if (!kurikulum || kurikulum.length === 0) {
          document.getElementById('fasalList').innerHTML = '<div class="activity-empty"><div class="activity-empty-icon"><i class="fa-solid fa-database"></i></div><p class="activity-empty-text">Tidak ada data materi di database.<br><small>Hubungi admin untuk menambahkan data.</small></p></div>';
          updateStats();
          return;
        }

        console.log('kurikulum count:', kurikulum.length);
        kurikulum.forEach(function(bagian) {
          console.log('bagian:', bagian.id, bagian.nama || bagian.title);
          (bagian.bab || []).forEach(function(bab) {
            allBabs.push({
              id: bab.id,
              title: bab.title || bab.nama || 'Bab ' + bab.order_index,
              order_index: bab.order_index,
              bagian_id: bagian.id,
              bagian_order: bagian.order_index,
              is_muqoddimah: bab.is_muqoddimah || false,
              content_arab: bab.content_arab || '',
              content_id: bab.content_id || ''
            });
            (bab.fasal || []).forEach(function(fasal) {
              allFasals.push({
                id: fasal.id,
                title: fasal.title || 'Fasal ' + fasal.order_index,
                order: bagian.order_index + '.' + bab.order_index + '.' + fasal.order_index,
                bab_id: bab.id,
                bab_title: bab.title || bab.nama || 'Bab ' + bab.order_index,
                bagian_id: bagian.id,
                bagian_order: bagian.order_index,
                content_arab: fasal.content_arab || ''
              });
            });
          });
        });

        var progressData = await fetchUserProgress();
        userProgress = progressData || [];

        allBabs.forEach(function(bab) {
          if (bab.is_muqoddimah || (bab.title && bab.title.toLowerCase().includes('muqoddimah'))) {
            items.push({
              type: 'bab',
              id: bab.id,
              title: bab.title,
              subtitle: 'Muqoddimah - Kitab Mukhtarat',
              order: bab.bagian_order * 1000 + bab.order_index * 100,
              hasContent: bab.content_arab && bab.content_arab.trim().length > 0,
              unlock_after_id: bab.unlock_after_id || null
            });
          }
        });

        allFasals.forEach(function(fasal) {
          items.push({
            type: 'fasal',
            id: fasal.id,
            title: fasal.title,
            subtitle: fasal.bab_title,
            order: fasal.bagian_order * 1000 + parseInt(fasal.order.split('.')[1]) * 100 + parseInt(fasal.order.split('.')[2]),
            hasContent: fasal.content_arab && fasal.content_arab.trim().length > 0,
            unlock_after_id: fasal.unlock_after_id || null
          });
        });

        items.sort(function(a, b) { return a.order - b.order; });

        var completedIds = userProgress.filter(function(p) { return p.status === 'completed'; }).map(function(p) { return p.fasal_id; });
        nextUnlockIndex = 0;
        for (var i = 0; i < items.length; i++) {
          var item = items[i];
          if (item.unlock_after_id) {
            if (!completedIds.includes(item.unlock_after_id)) {
              continue;
            }
          }
          if (!completedIds.includes(item.id)) {
            nextUnlockIndex = i;
            break;
          }
          if (i === items.length - 1) nextUnlockIndex = items.length;
        }

        updateStats();
        renderTimeline();
        renderRecentActivity();
        updateContinueSection();
        updateCurrentKitabSection();
      } catch (err) {
        console.error('loadDashboard error:', err);
        document.getElementById('fasalList').innerHTML = '<div class="activity-empty"><div class="activity-empty-icon"><i class="fa-solid fa-exclamation-triangle"></i></div><p class="activity-empty-text">Gagal memuat data: ' + err.message + '</p></div>';
      }
    }

    function updateStats() {
      var total = items.length;
      var completed = userProgress.filter(function(p) { return p.status === 'completed'; }).length;
      var percent = total > 0 ? Math.round((completed / total) * 100) : 0;
      var streak = calculateStreak();

      document.getElementById('statCompleted').textContent = completed;
      document.getElementById('statRemaining').textContent = total - completed;
      document.getElementById('statStreak').textContent = streak;
      document.getElementById('progressPercent').textContent = percent + '%';

      var circle = document.getElementById('progressCircle');
      var circumference = 2 * Math.PI * 60;
      var offset = circumference - (percent / 100) * circumference;
      circle.style.strokeDashoffset = offset;
    }

    function calculateStreak() {
      if (userProgress.length === 0) return 0;
      var dates = userProgress.map(function(p) { return new Date(p.completed_at || p.created_at).toDateString(); }).filter(function(d) { return d !== 'Invalid Date'; });
      var unique = [...new Set(dates)].sort(function(a, b) { return new Date(b) - new Date(a); });
      if (unique.length === 0) return 0;
      var today = new Date().toDateString();
      var yesterday = new Date(Date.now() - 86400000).toDateString();
      if (unique[0] !== today && unique[0] !== yesterday) return 0;
      var streak = 1;
      for (var i = 1; i < unique.length; i++) {
        var diff = (new Date(unique[i-1]) - new Date(unique[i])) / 86400000;
        if (diff === 1) streak++; else break;
      }
      return streak;
    }

    function updateContinueSection() {
      var section = document.getElementById('continueSection');

      // Find the first unlocked, uncompleted item
      var currentItem = null;
      var completedIds = userProgress.filter(function(p) { return p.status === 'completed'; }).map(function(p) { return p.fasal_id; });

      for (var i = 0; i < items.length; i++) {
        var item = items[i];
        // Check unlock_after_id: if set, must complete that item first
        if (item.unlock_after_id && !completedIds.includes(item.unlock_after_id)) {
          continue; // Locked by unlock_after_id
        }
        // Check if already completed
        if (!completedIds.includes(item.id)) {
          currentItem = item;
          break;
        }
      }

      if (!currentItem) {
        section.classList.add('hidden');
        return;
      }

      var progress = userProgress.find(function(p) { return p.fasal_id === currentItem.id; });
      var isInProgress = progress && progress.status !== 'completed';

      if (isInProgress || true) {
        section.classList.remove('hidden');
        currentItemData = currentItem;
        document.getElementById('continueTitle').textContent = currentItem.title;
        document.getElementById('continueSubtitle').textContent = currentItem.type === 'bab' ? 'Muqoddimah' : currentItem.subtitle;

        if (progress) {
          document.getElementById('continuePercent').textContent = progress.quiz_score + '%';
        }
      }
    }

      for (var i = 0; i < items.length; i++) {

    function renderTimeline() {
      var container = document.getElementById('fasalList');

      if (items.length === 0) {
        container.innerHTML = '<div class="activity-empty"><div class="activity-empty-icon"><i class="fa-solid fa-book-open"></i></div><p class="activity-empty-text">Belum ada materi</p></div>';
        return;
      }

      var completedIds = userProgress.filter(function(p) { return p.status === 'completed'; }).map(function(p) { return p.fasal_id; });

      var isItemUnlocked = function(item) {
        if (!item.unlock_after_id) return true;
        return completedIds.includes(item.unlock_after_id);
      };

      var html = '';

      items.forEach(function(item, index) {
        var isCompleted = completedIds.includes(item.id);
        var isUnlocked = isItemUnlocked(item);
        var isActive = isUnlocked && !isCompleted;
        var isLocked = !isUnlocked;

        var progress = userProgress.find(function(p) { return p.fasal_id === item.id; });

        var nodeClass = isCompleted ? 'completed' : isActive ? 'active' : 'locked';
        var cardClass = isCompleted ? 'completed' : isActive ? 'active' : '';

        var link = item.type === 'bab' ? 'materi.html?bab=' + item.id : 'materi.html?id=' + item.id;

        html += '<div class="timeline-item ' + (isLocked ? 'locked' : '') + '">';
        html += '<div class="timeline-node ' + nodeClass + '">';
        html += '</div>';
        html += '<div class="timeline-card ' + cardClass + '">';
        html += '<div class="timeline-badges">';
        html += '<span class="timeline-badge type">' + (item.type === 'bab' ? 'MUQODDIMAH' : 'FASAL ' + (index + 1)) + '</span>';
        if (isCompleted) {
          html += '<span class="timeline-badge status"><i class="fa-solid fa-check"></i> Selesai</span>';
        } else if (isActive) {
          html += '<span class="timeline-badge status active"><i class="fa-solid fa-spinner fa-spin"></i> Aktif</span>';
        } else if (isLocked) {
          html += '<span class="timeline-badge locked"><i class="fa-solid fa-lock"></i> Terkunci</span>';
        }
        html += '</div>';
        html += '<h4 class="timeline-item-title">' + item.title + '</h4>';
        html += '<p class="timeline-item-subtitle">' + item.subtitle + '</p>';

        if (isUnlocked) {
          html += '<div class="timeline-actions">';
          if (isCompleted) {
            html += '<a href="' + link + '" class="timeline-btn secondary"><i class="fa-solid fa-book-open"></i> Baca</a>';
            html += '<a href="' + link + '" class="timeline-btn secondary"><i class="fa-solid fa-redo"></i> Ulangi</a>';
          } else {
            html += '<a href="' + link + '" class="timeline-btn primary"><i class="fa-solid ' + (index === 0 ? 'fa-play' : 'fa-arrow-right') + '"></i> ' + (index === 0 ? 'Mulai' : 'Lanjutkan') + '</a>';
          }
          html += '</div>';
        } else {
          html += '<div class="timeline-actions">';
          html += '<span class="timeline-btn locked"><i class="fa-solid fa-lock"></i> Terkunci</span>';
          html += '</div>';
        }

        html += '</div></div>';
      });

      container.innerHTML = html;
    }

    function renderRecentActivity() {
      var container = document.getElementById('recentActivity');
      var fasalMap = {};
      items.forEach(function(item) {
        fasalMap[item.id] = item.title;
      });

      if (userProgress.length === 0) {
        container.innerHTML = '<div class="activity-empty"><div class="activity-empty-icon"><i class="fa-solid fa-inbox"></i></div><p class="activity-empty-text">Belum ada aktivitas</p></div>';
        return;
      }

      var recent = userProgress.slice().sort(function(a, b) { return new Date(b.completed_at || b.created_at) - new Date(a.completed_at || a.created_at); }).slice(0, 5);
      var html = '<div style="display: flex; flex-direction: column; gap: 12px;">';

      var getDateLabel = function(date) {
        var d = new Date(date);
        var today = new Date();
        var yesterday = new Date(Date.now() - 86400000);

        if (d.toDateString() === today.toDateString()) return 'Hari ini';
        if (d.toDateString() === yesterday.toDateString()) return 'Kemarin';
        return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
      };

      var grouped = {};
      recent.forEach(function(p) {
        var label = getDateLabel(p.completed_at || p.created_at);
        if (!grouped[label]) grouped[label] = [];
        grouped[label].push(p);
      });

      Object.entries(grouped).forEach(function(dateLabel) {
        html += '<div style="margin-bottom: 16px;">';
        html += '<h4 style="font-size: 0.65rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px;">' + dateLabel[0] + '</h4>';
        dateLabel[1].forEach(function(p) {
          var label = fasalMap[p.fasal_id] || p.fasal_id;
          var isCompleted = p.status === 'completed';
          var time = new Date(p.completed_at || p.created_at).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });

          html += '<div style="display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--bg-base); border-radius: 14px; margin-bottom: 8px;">';
          html += '<div style="width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; ' + (isCompleted ? 'background: var(--accent-soft); color: var(--accent);' : 'background: var(--blue-soft); color: var(--blue);') + '">';
          html += '<i class="fa-solid ' + (isCompleted ? 'fa-check' : 'fa-play') + '"></i>';
          html += '</div>';
          html += '<div style="flex: 1; min-width: 0;">';
          html += '<p style="font-size: 0.875rem; font-weight: 600; color: var(--text-primary); margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">' + label + '</p>';
          html += '<p style="font-size: 0.75rem; color: var(--text-muted);">' + time + ' • ' + (isCompleted ? 'Skor ' + p.quiz_score + '%' : p.status) + '</p>';
          html += '</div>';
          if (isCompleted) {
            html += '<span style="font-size: 1.1rem; font-weight: 800; color: var(--accent);">' + p.quiz_score + '%</span>';
          }
          html += '</div>';
        });
        html += '</div>';
      });

      html += '</div>';
      container.innerHTML = html;
    }

    async function checkStreak() {
      try {
        var token = getToken();
        var headers = { 'apikey': SUPABASE_ANON_KEY };
        if (token) headers['Authorization'] = 'Bearer ' + token;

        var user = await getCurrentUser();
        if (!user) return;
        var res = await fetch(SUPABASE_URL + '/rest/v1/user_progress?user_id=eq.' + user.id + '&order=completed_at.desc&limit=1', { headers });
        if (!res.ok) return;
        var progress = await res.json().catch(() => []);

        if (progress && progress.length > 0) {
          var lastActivity = new Date(progress[0].completed_at);
          var today = new Date();
          var daysDiff = Math.floor((today - lastActivity) / (1000 * 60 * 60 * 24));

          if (daysDiff >= 1 && daysDiff < 7) {
            var toast = document.getElementById('streakToast');
            var toastText = document.getElementById('streakToastText');
            toastText.textContent = daysDiff === 1 ? 'Ayo lanjut belajarnya! Streak hampir putus.' : 'Ayo belajar lagi! Streak sudah ' + daysDiff + ' hari tidak aktif.';
            toast.classList.remove('hidden');
            setTimeout(function() { toast.classList.add('hidden'); }, 5000);
          }
        }
      } catch(e) {}
    }

    async function loadKitabCards() {
      var container = document.getElementById('kitabCards');
      try {
        var token = getToken();
        var headers = { 'apikey': SUPABASE_ANON_KEY };
        if (token) headers['Authorization'] = 'Bearer ' + token;

        var jenjangs = [], kitabs = [], allProgress = [];
        try {
          var jenjangRes = await fetch(SUPABASE_URL + 'rest/v1/jenjang?order=order_index', { headers });
          if (jenjangRes.ok) jenjangs = await jenjangRes.json().catch(() => []);
        } catch(e) {}
        try {
          var kitabRes = await fetch(SUPABASE_URL + 'rest/v1/kitab?order=order_index', { headers });
          if (kitabRes.ok) kitabs = await kitabRes.json().catch(() => []);
        } catch(e) {}
        // Fetch progress from user_progress table
        try {
          var user = await getCurrentUser();
          if (user) {
            var progressRes = await fetch(SUPABASE_URL + '/rest/v1/user_progress?user_id=eq.' + user.id, { headers });
            if (progressRes.ok) {
              allProgress = await progressRes.json().catch(() => []);
            } else {
              allProgress = [];
            }
          }
        } catch(e) {
          allProgress = [];
        }

        allJenjangs = jenjangs;
        allKitabs = kitabs;

        // Filter kitabs by user's jenjang if set
        var userJenjangId = currentUserData && currentUserData.jenjang_id;
        var filteredKitabs = userJenjangId ? kitabs.filter(k => k.jenjang_id === userJenjangId) : kitabs;

        if (filteredKitabs.length === 0) {
          container.innerHTML = '<div style="text-align:center; padding:60px 40px; color:var(--text-muted); grid-column:1/-1;"><i class="fa-solid fa-book-open" style="font-size:2.5rem; margin-bottom:16px; display:block; opacity:0.5;"></i><p>Belum ada kitab untuk jenjangmu</p></div>';
          return;
        }

        // Build progress map by kitab_id with bab details
        var progressMap = {};
        allProgress.forEach(function(p) {
          if (!progressMap[p.kitab_id]) progressMap[p.kitab_id] = { completed: 0, total: 0, lastBabId: null, babMap: {} };
          if (p.status === 'completed') progressMap[p.kitab_id].completed++;
          progressMap[p.kitab_id].total++;
          if (p.last_position) progressMap[p.kitab_id].lastBabId = p.last_position;
          if (p.bab_id) progressMap[p.kitab_id].babMap[p.bab_id] = true;
        });

        var html = '';
        for (var k of filteredKitabs) {
          var jenjang = jenjangs.find(j => j.id === k.jenjang_id);
          var jenjangLabel = jenjang ? (jenjang.nama || jenjang.title || '') : '';
          var progress = progressMap[k.id] || { completed: 0, total: 0, lastBabId: null };
          var hasProgress = progress.total > 0;
          var percent = progress.total > 0 ? Math.round((progress.completed / progress.total) * 100) : 0;

          var coverHtml;
          if (k.image_url) {
            coverHtml = '<img src="' + escHtml(k.image_url) + '" alt="' + escHtml(k.nama || k.title || '') + '" class="kitab-card-cover" onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'flex\';">' +
                          '<div class="kitab-card-cover-placeholder" style="display:none;"><i class="fa-solid fa-book"></i></div>';
          } else {
            coverHtml = '<div class="kitab-card-cover-placeholder"><i class="fa-solid fa-book"></i></div>';
          }

          var btnClass = hasProgress ? 'kitab-card-btn-lanjut' : 'kitab-card-btn-mulai';
          var btnText = hasProgress ? 'Lanjut' : 'Mulai';
          var progressText = hasProgress ? progress.completed + '/' + progress.total + ' selesai' : 'Belum dimulai';

          html += '<div class="kitab-card" style="text-decoration:none; color:inherit; display:flex; flex-direction:column;">' +
            coverHtml +
            '<div class="kitab-card-body">' +
              '<div class="kitab-card-title">' + escHtml(k.nama || k.title || 'Kitab') + '</div>' +
              (k.penulis ? '<div class="kitab-card-author">' + escHtml(k.penulis) + '</div>' : '') +
              (jenjangLabel ? '<div class="kitab-card-jenjang">' + escHtml(jenjangLabel) + '</div>' : '') +
              '<div class="kitab-card-progress"><div class="kitab-card-progress-fill" style="width:' + percent + '%"></div></div>' +
              '<div style="font-size:0.7rem; color:var(--text-muted); margin-top:4px;">' + progressText + '</div>';

          // Always show button - "Lanjut" if has progress, "Mulai" if not
          html += '<button class="kitab-card-btn ' + btnClass + '" onclick="window.openKitab(\'' + k.id + '\')">' + btnText + '</button>';

          html += '</div></div>';
        }
        container.innerHTML = html;
      } catch (e) {
        console.error('loadKitabCards error:', e);
        container.innerHTML = '<div style="text-align:center; padding:60px 40px; color:var(--text-muted); grid-column:1/-1;"><p>Gagal memuat kitab</p></div>';
      }
    }

    async function openKitab(kitabId) {
      try {
        var token = getToken();
        var headers = { 'apikey': SUPABASE_ANON_KEY };
        if (token) headers['Authorization'] = 'Bearer ' + token;

        // Get kitab info
        var kitabRes = await fetch(SUPABASE_URL + 'rest/v1/kitab?id=eq.' + kitabId, { headers });
        var kitabs = await kitabRes.json().catch(() => []);
        if (kitabs.length === 0) return;
        var kitab = kitabs[0];

        // Get bagian and bab (go to first bab directly)
        var bagianRes = await fetch(SUPABASE_URL + 'rest/v1/bagian?kitab_id=eq.' + kitabId + '&order=order_index&limit=1', { headers });
        var bagians = await bagianRes.json().catch(() => []);
        if (bagians.length === 0) {
          alert('Materi belum tersedia untuk kitab ini');
          return;
        }

        var babRes = await fetch(SUPABASE_URL + 'rest/v1/bab?bagian_id=eq.' + bagians[0].id + '&order=order_index&limit=1', { headers });
        var babs = await babRes.json().catch(() => []);
        if (babs.length === 0) {
          alert('Materi belum tersedia');
          return;
        }

        // Show popup with bab content
        showMateriPopup(babs[0], kitab, bagians[0]);

        // Store next bab id for navigation after quiz
        window.nextBabId = null;
        await loadNextBab(babs[0].id, kitab.id, bagians[0].order_index);
      } catch(e) {
        console.error('openKitab error:', e);
        alert('Gagal memuat materi');
      }
    }
    window.openKitab = openKitab;

    async function loadNextBab(currentBabId, kitabId, currentBagianOrder) {
      try {
        var token = getToken();
        var headers = { 'apikey': SUPABASE_ANON_KEY };
        if (token) headers['Authorization'] = 'Bearer ' + token;

        // Get current bab's bagian
        var babRes = await fetch(SUPABASE_URL + 'rest/v1/bab?id=eq.' + currentBabId + '&select=*,bagian(*)', { headers });
        var babs = await babRes.json().catch(() => []);
        if (babs.length === 0) return;
        var currentBab = babs[0];

        // Try next bab in same bagian
        var nextBabRes = await fetch(SUPABASE_URL + 'rest/v1/bab?bagian_id=eq.' + currentBab.bagian_id + '&order_index=gt.' + currentBab.order_index + '&order=order_index&limit=1', { headers });
        var nextBabs = await nextBabRes.json().catch(() => []);
        if (nextBabs.length > 0) {
          window.nextBabId = nextBabs[0].id;
          return;
        }

        // Try first bab in next bagian
        var nextBagianRes = await fetch(SUPABASE_URL + 'rest/v1/bagian?kitab_id=eq.' + kitabId + '&order_index=gt.' + currentBagianOrder + '&order=order_index&limit=1', { headers });
        var nextBagians = await nextBagianRes.json().catch(() => []);
        if (nextBagians.length > 0) {
          var firstBabRes = await fetch(SUPABASE_URL + 'rest/v1/bab?bagian_id=eq.' + nextBagians[0].id + '&order=order_index&limit=1', { headers });
          var firstBabs = await firstBabRes.json().catch(() => []);
          if (firstBabs.length > 0) {
            window.nextBabId = firstBabs[0].id;
          }
        }
      } catch(e) { console.error('loadNextBab error:', e); }
    }

    function showMateriPopup(bab, kitab, bagian) {
      var modal = document.getElementById('materiModal');
      var title = document.getElementById('materiModalTitle');
      var badge = document.getElementById('materiModalBadge');
      var body = document.getElementById('materiModalBody');
      var actionBtn = document.getElementById('materiModalActionBtn');

      title.textContent = bab.title || bab.nama || 'Materi';
      badge.textContent = bab.is_muqoddimah ? 'MUQODDIMAH' : 'MATERI';

      var html = '';
      if (bab.content_arab) {
        html += '<div class="materi-section-label">Konten Arab</div>';
        html += '<div class="materi-content-arab">';
        html += '<p class="arabic-text" style="text-align:right; direction:rtl; margin:0;">' + escHtml(bab.content_arab) + '</p>';
        html += '</div>';
      }
      if (bab.content_id) {
        html += '<div class="materi-section-label" style="margin-top:' + (bab.content_arab ? '20px' : '0') + ';">Terjemahan</div>';
        html += '<div class="materi-content-translation">';
        html += '<p style="margin:0; line-height:1.8;">' + escHtml(bab.content_id) + '</p>';
        html += '</div>';
      }
      if (!bab.content_arab && !bab.content_id) {
        html += '<div style="text-align:center; padding:40px 20px; color:var(--text-muted);">';
        html += '<i class="fa-solid fa-file-lines" style="font-size:3rem; opacity:0.3; margin-bottom:12px;"></i>';
        html += '<p>Konten belum tersedia</p>';
        html += '</div>';
      }

      body.innerHTML = html;

      // Store bab id for quiz
      window.currentBabId = bab.id;
      window.currentKitabId = kitab.id;

      // Change action button to open quiz modal
      actionBtn.innerHTML = '<i class="fa-solid fa-brain"></i> Mulai Evaluasi';
      actionBtn.onclick = function() {
        closeMateriModal();
        showQuizModal(bab.id);
      };

      modal.classList.remove('hidden');
    }

    function showQuizModal(babId) {
      var modal = document.getElementById('quizModal');
      var body = document.getElementById('quizModalBody');
      var startScreen = document.getElementById('quizStartScreen');
      var quizContent = document.getElementById('quizContent');

      startScreen.style.display = 'block';
      quizContent.style.display = 'none';
      body.innerHTML = startScreen.outerHTML + quizContent.outerHTML;

      window.quizBabId = babId;

      modal.classList.remove('hidden');
    }

    async function startInlineQuiz() {
      var babId = window.quizBabId;
      if (!babId) return;

      var token = getToken();
      var headers = { 'apikey': SUPABASE_ANON_KEY };
      if (token) headers['Authorization'] = 'Bearer ' + token;

      window.quizStartScreen = document.getElementById('quizStartScreen');
      window.quizContent = document.getElementById('quizContent');
      window.quizStartScreen.style.display = 'none';
      window.quizContent.style.display = 'block';

      window.quizContent.innerHTML = '<div style="text-align:center; padding:40px;"><div class="spinner" style="margin:0 auto;"></div><p>Memuat soal evaluasi...</p></div>';

      try {
        var res = await fetch(SUPABASE_URL + 'rest/v1/quiz?bab_id=eq.' + babId + '&select=*', { headers });
        var quizzes = await res.json().catch(() => []);

        if (quizzes.length === 0) {
          window.quizContent.innerHTML = '<div style="text-align:center; padding:40px;">';
          window.quizContent.innerHTML += '<i class="fa-solid fa-inbox" style="font-size:3rem; color:var(--text-muted); margin-bottom:12px;"></i>';
          window.quizContent.innerHTML += '<p style="color:var(--text-muted);">Belum ada soal evaluasi untuk materi ini.</p>';
          window.quizContent.innerHTML += '</div>';
          return;
        }

        // Shuffle and pick questions
        var questions = quizzes.sort(() => Math.random() - 0.5).slice(0, Math.min(10, quizzes.length));
        window.quizQuestions = questions;
        window.quizCurrentIndex = 0;
        window.quizAnswers = {};

        window.renderQuizQuestion();
      } catch(e) {
        window.quizContent.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-muted);"><p>Gagal memuat soal evaluasi</p></div>';
      }
    }
    window.startInlineQuiz = startInlineQuiz;

    function renderQuizQuestion() {
      var q = window.quizQuestions[window.quizCurrentIndex];
      var quizContent = document.getElementById('quizContent');

      var html = '<div class="quiz-progress-dots">';
      for (var i = 0; i < window.quizQuestions.length; i++) {
        html += '<div class="quiz-dot' + (i === window.quizCurrentIndex ? ' current' : '') + (window.quizAnswers[i] !== undefined ? ' answered' : '') + '"></div>';
      }
      html += '</div>';

      html += '<div class="quiz-question-box">';
      html += '<div class="quiz-question-text">' + (window.quizCurrentIndex + 1) + '. ' + escHtml(q.question || '') + '</div>';

      if (q.quiz_type === 'mc' && q.options) {
        var options;
        try { options = typeof q.options === 'string' ? JSON.parse(q.options) : q.options; }
        catch(e) { options = {}; }
        html += '<div class="quiz-options">';
        for (var key in options) {
          html += '<div class="quiz-option' + (window.quizAnswers[window.quizCurrentIndex] === key ? ' selected' : '') + '" onclick="window.selectQuizAnswer(\'' + key + '\')">';
          html += '<div class="quiz-option-key">' + key + '</div>';
          html += '<div class="quiz-option-text">' + escHtml(options[key]) + '</div>';
          html += '</div>';
        }
        html += '</div>';
      } else {
        // For fill-arab, fill, latin, or any other fill type - show input box
        var savedValue = window.quizAnswers[window.quizCurrentIndex] || '';
        var isArab = (q.quiz_type === 'fill-arab');
        html += '<div style="margin-top:16px;">';
        html += '<input type="text" id="quizFillInput" placeholder="' + (isArab ? 'اكتب الجواب' : 'Ketik jawaban...') + '" style="width:100%; padding:16px; border-radius:12px; border:2px solid var(--accent); font-size:1.1rem; ' + (isArab ? 'text-align:right; direction:rtl; font-family:\"Amiri\",serif;' : '') + 'background:var(--bg-card);" value="' + escHtml(savedValue) + '" oninput="window.quizAnswers[' + window.quizCurrentIndex + ']=this.value">';
        html += '</div>';
      }
      html += '</div>';

      html += '<div class="quiz-nav">';
      html += '<button class="btn btn-secondary"' + (window.quizCurrentIndex === 0 ? ' disabled' : '') + ' onclick="window.prevQuizQuestion()"><i class="fa-solid fa-arrow-left"></i> Sebelumnya</button>';
      if (window.quizCurrentIndex < window.quizQuestions.length - 1) {
        html += '<button class="btn btn-primary" onclick="window.nextQuizQuestion()">Selanjutnya <i class="fa-solid fa-arrow-right"></i></button>';
      } else {
        html += '<button class="btn btn-primary" onclick="window.submitQuiz()">Kirim Jawaban <i class="fa-solid fa-check"></i></button>';
      }
      html += '</div>';

      quizContent.innerHTML = html;
    }
    window.renderQuizQuestion = renderQuizQuestion;

    function selectQuizAnswer(key) {
      window.quizAnswers[window.quizCurrentIndex] = key;
      renderQuizQuestion();
    }
    window.selectQuizAnswer = selectQuizAnswer;

    function nextQuizQuestion() {
      captureFillAnswer();
      if (window.quizCurrentIndex < window.quizQuestions.length - 1) {
        window.quizCurrentIndex++;
        window.renderQuizQuestion();
      }
    }

    function prevQuizQuestion() {
      captureFillAnswer();
      if (window.quizCurrentIndex > 0) {
        window.quizCurrentIndex--;
        window.renderQuizQuestion();
      }
    }

    function captureFillAnswer() {
      var input = document.getElementById('quizFillInput');
      if (input) {
        window.quizAnswers[window.quizCurrentIndex] = input.value;
      }
    }

    function saveFillAnswer() {
      var input = document.getElementById('quizFillInput');
      if (input) {
        window.quizAnswers[window.quizCurrentIndex] = input.value;
      }
    }
    window.saveFillAnswer = saveFillAnswer;
    window.nextQuizQuestion = nextQuizQuestion;
    window.prevQuizQuestion = prevQuizQuestion;

    function submitQuiz() {
      var correct = 0;
      for (var i = 0; i < window.quizQuestions.length; i++) {
        var q = window.quizQuestions[i];
        var answer = window.quizAnswers[i];
        if (q.correct_answer === answer) correct++;
      }

      var score = Math.round((correct / window.quizQuestions.length) * 100);
      var passed = score >= 80;

      var quizContent = document.getElementById('quizContent');
      quizContent.innerHTML = '<div style="text-align:center; padding:40px;">';

      if (passed) {
        quizContent.innerHTML += '<div style="width:80px; height:80px; background:linear-gradient(135deg, var(--accent), var(--accent-light)); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px;"><i class="fa-solid fa-check" style="font-size:2.5rem; color:white;"></i></div>';
        quizContent.innerHTML += '<h3 style="color:var(--accent); margin:0 0 8px 0;">Alhamdulillah!</h3>';
      } else {
        quizContent.innerHTML += '<div style="width:80px; height:80px; background:linear-gradient(135deg, #f59e0b, #fbbf24); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px;"><i class="fa-solid fa-exclamation" style="font-size:2.5rem; color:white;"></i></div>';
        quizContent.innerHTML += '<h3 style="color:var(--amber); margin:0 0 8px 0;">Belum Lulus</h3>';
      }

      quizContent.innerHTML += '<p style="font-size:2rem; font-weight:700; margin:0 0 8px 0;">' + score + '%</p>';
      quizContent.innerHTML += '<p style="color:var(--text-muted); margin:0 0 24px 0;">' + correct + ' dari ' + window.quizQuestions.length + ' benar</p>';

      if (!passed) {
        quizContent.innerHTML += '<button class="btn btn-primary" onclick="window.retryQuiz()"><i class="fa-solid fa-redo"></i> Coba Lagi</button>';
      } else {
        quizContent.innerHTML += '<p style="color:var(--accent); margin-bottom:16px;"><i class="fa-solid fa-check-circle"></i> Alhamdulillah! Kamu lulus evaluasi.</p>';
        quizContent.innerHTML += '<button class="btn btn-primary" onclick="goToNextMateri()" style="margin-bottom:12px;"><i class="fa-solid fa-arrow-right"></i> Lanjut ke Materi Berikutnya</button>';
        quizContent.innerHTML += '<button class="btn btn-secondary" onclick="closeQuizModal(); closeMateriModal();"><i class="fa-solid fa-home"></i> Kembali ke Beranda</button>';
      }

      quizContent.innerHTML += '</div>';
    }
    window.submitQuiz = submitQuiz;

    function retryQuiz() {
      window.quizCurrentIndex = 0;
      window.quizAnswers = {};
      window.renderQuizQuestion();
    }
    window.retryQuiz = retryQuiz;

    function closeMateriModal() {
      document.getElementById('materiModal').classList.add('hidden');
    }
    window.closeMateriModal = closeMateriModal;

    function closeQuizModal() {
      document.getElementById('quizModal').classList.add('hidden');
    }
    window.closeQuizModal = closeQuizModal;

    function goToNextMateri() {
      closeQuizModal();
      closeMateriModal();
      // Go to next bab in materi.html
      if (window.nextBabId) {
        window.location.href = 'materi.html?bab=' + window.nextBabId;
      } else {
        // No more materi, go back to student dashboard
        window.location.href = 'student.html';
      }
    }
    window.goToNextMateri = goToNextMateri;

    function handleLogout() {
      logout();
      window.location.href = 'auth.html';
    }

    function escHtml(text) {
      if (!text) return '';
      return String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function logout() {
      localStorage.removeItem('mbba_token');
      localStorage.removeItem('mbba_user');
    }
  </script>
</body>
</html>
