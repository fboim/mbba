<!DOCTYPE html>
<html lang="id" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — MBBA</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%2322c55e' width='32' height='32' rx='6'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-family='Amiri,serif' font-size='20' fill='white'>م</text></svg>">
  <link rel="stylesheet" href="../css/output.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .arabic-text { font-family: 'Amiri', serif; direction: rtl; text-align: right; line-height: 2.2; }
  </style>
</head>
<body class="bg-slate-50 font-sans min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 md:px-6 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-primary-600 rounded-lg flex items-center justify-center">
          <span class="text-white font-bold text-sm">م</span>
        </div>
        <span class="font-bold text-slate-800">MBBA</span>
      </div>
      <div class="flex items-center gap-3">
        <span id="userName" class="text-sm text-slate-600 hidden md:inline">Hai, Pelajar</span>
        <a href="profile.html" class="p-2 rounded-lg hover:bg-slate-100 text-slate-500" title="Profil">
          <i class="fa-solid fa-user text-sm"></i>
        </a>
        <a id="adminLink" href="admin.html" class="p-2 rounded-lg hover:bg-amber-50 text-amber-500 hidden" title="Admin Panel">
          <i class="fa-solid fa-gear text-sm"></i>
        </a>
        <button onclick="handleLogout()" class="p-2 rounded-lg hover:bg-red-50 text-slate-400 hover:text-red-500" title="Logout">
          <i class="fa-solid fa-right-from-bracket text-sm"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto px-4 md:px-6 py-6">

    <!-- Welcome -->
    <div class="mb-6">
      <h1 class="text-2xl md:text-3xl font-bold text-slate-800 mb-2">
        <i class="fa-solid fa-graduation-cap text-primary-500 mr-2"></i>
        Assalamu'alaikum
      </h1>
      <p class="text-slate-500">Selamat datang di Madrasah Belajar Bahasa Arab</p>
    </div>

    <!-- Progress Cards -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
      <div class="bg-blue-600 rounded-xl p-4 text-white text-center">
        <div class="text-3xl font-bold" id="totalFasal">0</div>
        <div class="text-sm opacity-80">Total Materi</div>
      </div>
      <div class="bg-green-600 rounded-xl p-4 text-white text-center">
        <div class="text-3xl font-bold" id="completedFasal">0</div>
        <div class="text-sm opacity-80">Selesai</div>
      </div>
      <div class="bg-amber-500 rounded-xl p-4 text-white text-center">
        <div class="text-3xl font-bold" id="avgScore">0%</div>
        <div class="text-sm opacity-80">Rata-rata</div>
      </div>
      <div class="bg-purple-600 rounded-xl p-4 text-white text-center">
        <div class="text-3xl font-bold" id="streakDays">0</div>
        <div class="text-sm opacity-80">Streak</div>
      </div>
    </div>

    <!-- Fasal List -->
    <div class="bg-white rounded-xl border border-slate-200 p-6 mb-6">
      <h2 class="text-lg font-semibold text-slate-800 mb-4">
        <i class="fa-solid fa-book-open text-primary-500 mr-2"></i>
        Mulai Belajar
      </h2>
      <div id="fasalList" class="text-slate-500">Memuat...</div>
    </div>

    <!-- Recent Activity -->
    <div class="bg-white rounded-xl border border-slate-200 p-6">
      <h2 class="text-lg font-semibold text-slate-800 mb-4">
        <i class="fa-solid fa-clock text-amber-500 mr-2"></i>
        Aktivitas Terakhir
      </h2>
      <div id="recentActivity" class="text-slate-400 text-center py-4">Belum ada aktivitas</div>
    </div>

  </main>

  <script src="../js/api.js"></script>
  <script>
    var allFasals = [];
    var allBabs = [];
    var userProgress = [];
    var fasalMap = {};

    (async function() {
      var user = await getCurrentUser();
      if (!user) {
        window.location.href = 'auth.html';
        return;
      }
      setUserRole(user);
      var role = user.user_metadata && user.user_metadata.role || 'student';
      if (role === 'admin' || role === 'teacher') {
        document.getElementById('adminLink').classList.remove('hidden');
      }
      var name = (user.user_metadata && user.user_metadata.full_name) || user.email || 'Pelajar';
      document.getElementById('userName').textContent = 'Hai, ' + name;
      await loadDashboard();
    })();

    async function loadDashboard() {
      try {
        var kurikulum = await fetchKurikulum();
        allFasals = [];
        allBabs = [];

        if (!kurikulum || kurikulum.length === 0) {
          document.getElementById('fasalList').innerHTML = '<div class="text-center py-8 text-slate-400"><i class="fa-solid fa-folder-open text-4xl mb-4"></i><p>Tidak ada data materi</p></div>';
          updateStats();
          return;
        }

        kurikulum.forEach(function(bagian) {
          (bagian.bab || []).forEach(function(bab) {
            allBabs.push({
              id: bab.id,
              title: bab.title || bab.nama || 'Bab ' + bab.order_index,
              order_index: bab.order_index,
              bagian_id: bagian.id,
              bagian_order: bagian.order_index,
              is_muqoddimah: bab.is_muqoddimah || false,
              content_arab: bab.content_arab || '',
              content_id: bab.content_id || ''
            });
            (bab.fasal || []).forEach(function(fasal) {
              allFasals.push({
                id: fasal.id,
                title: fasal.title || 'Fasal ' + fasal.order_index,
                order: bagian.order_index + '.' + bab.order_index + '.' + fasal.order_index,
                bab_id: bab.id,
                bab_title: bab.title || bab.nama || 'Bab ' + bab.order_index,
                bagian_id: bagian.id,
                bagian_order: bagian.order_index,
                content_arab: fasal.content_arab || ''
              });
            });
          });
        });

        var progressData = await fetchUserProgress();
        userProgress = progressData || [];

        updateStats();
        renderFasalList();
        renderRecentActivity();
      } catch (err) {
        console.error('Error:', err);
        document.getElementById('fasalList').innerHTML = '<div class="text-center py-8 text-red-400"><p>Gagal memuat data</p><p class="text-sm">' + err.message + '</p></div>';
      }
    }

    function updateStats() {
      var total = allBabs.filter(function(b) { return b.is_muqoddimah; }).length + allFasals.length;
      var completed = userProgress.filter(function(p) { return p.status === 'completed'; }).length;
      var avgScore = userProgress.length > 0 ? Math.round(userProgress.reduce(function(s, p) { return s + (p.quiz_score || 0); }, 0) / userProgress.length) : 0;

      document.getElementById('totalFasal').textContent = total;
      document.getElementById('completedFasal').textContent = completed;
      document.getElementById('avgScore').textContent = avgScore + '%';
      document.getElementById('streakDays').textContent = calculateStreak();
    }

    function calculateStreak() {
      if (userProgress.length === 0) return 0;
      var dates = userProgress.map(function(p) { return new Date(p.completed_at || p.created_at).toDateString(); }).filter(function(d) { return d !== 'Invalid Date'; });
      var unique = [...new Set(dates)].sort(function(a, b) { return new Date(b) - new Date(a); });
      if (unique.length === 0) return 0;
      var today = new Date().toDateString();
      var yesterday = new Date(Date.now() - 86400000).toDateString();
      if (unique[0] !== today && unique[0] !== yesterday) return 0;
      var streak = 1;
      for (var i = 1; i < unique.length; i++) {
        var diff = (new Date(unique[i-1]) - new Date(unique[i])) / 86400000;
        if (diff === 1) streak++; else break;
      }
      return streak;
    }

    function renderFasalList() {
      var container = document.getElementById('fasalList');
      var items = [];

      // Add Muqoddimah (bab with is_muqoddimah)
      allBabs.forEach(function(bab) {
        if (bab.is_muqoddimah) {
          items.push({
            type: 'bab',
            id: bab.id,
            title: bab.title,
            label: 'Kitab Mukhtarat > Bagian ' + bab.bagian_order + ' > Bab ' + bab.order_index + ' > ' + bab.title,
            order: bab.bagian_order * 100 + bab.order_index * 10,
            hasContent: bab.content_arab && bab.content_arab.trim().length > 0
          });
        }
      });

      // Add fasals
      allFasals.forEach(function(fasal) {
        items.push({
          type: 'fasal',
          id: fasal.id,
          title: fasal.title,
          label: 'Kitab Mukhtarat > Bagian ' + fasal.bagian_order + ' > Bab ' + fasal.bab_id.split('-')[0].length + ' > ' + fasal.title,
          order: fasal.order.split('.').map(function(n) { return parseInt(n) || 0; }).reduce(function(a, b) { return a * 1000 + b; }, 0),
          hasContent: fasal.content_arab && fasal.content_arab.trim().length > 0
        });
      });

      if (items.length === 0) {
        container.innerHTML = '<div class="text-center py-8 text-slate-400"><i class="fa-solid fa-folder-open text-4xl mb-4"></i><p>Belum ada materi</p></div>';
        return;
      }

      // Sort by order
      items.sort(function(a, b) { return a.order - b.order; });

      // Progress summary
      var total = items.length;
      var completedIds = userProgress.filter(function(p) { return p.status === 'completed'; }).map(function(p) { return p.fasal_id; });
      var completed = completedIds.length;
      var percent = total > 0 ? Math.round((completed / total) * 100) : 0;

      var html = '<div class="mb-4 p-3 bg-slate-50 rounded-lg">';
      html += '<div class="flex justify-between items-center mb-2">';
      html += '<span class="text-sm font-medium text-slate-700">Progress Belajar</span>';
      html += '<span class="text-sm font-bold text-primary-600">' + completed + '/' + total + ' (' + percent + '%)</span>';
      html += '</div>';
      html += '<div class="w-full bg-slate-200 rounded-full h-2">';
      html += '<div class="bg-primary-500 h-2 rounded-full" style="width:' + percent + '%"></div>';
      html += '</div></div>';

      html += '<div class="font-semibold text-slate-600 text-sm mb-2">Daftar Materi (wajib berurutan):</div>';

      // Find first unlocked (check both direct ID and bab_X format)
      var nextUnlock = 0;
      for (var i = 0; i < items.length; i++) {
        var itemId = items[i].id;
        var isCompleted = completedIds.includes(itemId) || completedIds.includes('bab_' + itemId);
        if (!isCompleted) {
          nextUnlock = i;
          break;
        }
        if (i === items.length - 1) nextUnlock = items.length;
      }

      // Render items
      items.forEach(function(item, index) {
        // For bab items, use bab.id directly; for fasal items, use fasal id
        var itemId = item.type === 'bab' ? item.id : item.id;
        var progress = userProgress.find(function(p) { return p.fasal_id === itemId || p.fasal_id === 'bab_' + itemId; });
        var isUnlocked = index <= nextUnlock;
        var isCompleted = progress && progress.status === 'completed';

        var badgeClass = item.type === 'bab' ? 'bg-amber-100 text-amber-700' : 'bg-blue-100 text-blue-700';
        var badgeText = item.type === 'bab' ? 'Muqoddimah' : 'Fasal';

        var statusClass, btnClass, btnIcon, btnText;
        if (isCompleted) {
          statusClass = 'bg-green-100 text-green-700';
          btnClass = 'bg-primary-600 hover:bg-primary-700';
          btnIcon = 'fa-book-open';
          btnText = 'Baca Lagi';
          isUnlocked = true;
        } else if (isUnlocked) {
          statusClass = 'bg-blue-100 text-blue-700';
          btnClass = 'bg-green-600 hover:bg-green-700';
          btnIcon = 'fa-play';
          btnText = index === 0 ? 'Mulai' : 'Kerjakan';
        } else {
          statusClass = 'bg-slate-100 text-slate-400';
          btnClass = 'bg-slate-300 cursor-not-allowed';
          btnIcon = 'fa-lock';
          btnText = 'Kunci';
        }

        var link = item.type === 'bab' ? 'materi.html?bab=' + item.id : 'materi.html?id=' + item.id;

        html += '<div class="flex items-center justify-between p-4 bg-white rounded-lg border border-slate-200 mb-2' + (isUnlocked && !isCompleted ? ' border-blue-200' : '') + '">';
        html += '<div class="flex items-center gap-3 flex-1">';
        html += '<div class="w-10 h-10 rounded-full flex items-center justify-center ' + statusClass + '">';
        html += '<i class="fa-solid ' + (item.type === 'bab' ? 'fa-book' : 'fa-file-lines') + ' text-sm"></i>';
        html += '</div>';
        html += '<div class="flex-1">';
        html += '<div class="flex items-center gap-2 mb-1">';
        html += '<span class="text-xs px-2 py-0.5 rounded font-semibold ' + badgeClass + '">' + badgeText + '</span>';
        html += '<span class="font-medium text-slate-800">' + item.title + '</span>';
        html += '</div>';
        html += '<div class="text-xs text-slate-400 truncate">' + item.label + '</div>';
        html += '</div></div>';
        html += '<div class="flex items-center gap-2">';
        if (isUnlocked) {
          html += '<a href="' + link + '" class="px-4 py-2 ' + btnClass + ' text-white text-sm font-semibold rounded-lg shadow-sm">' + '<i class="fa-solid ' + btnIcon + ' mr-1"></i>' + btnText + '</a>';
        } else {
          html += '<span class="px-4 py-2 bg-slate-200 text-slate-400 text-sm font-semibold rounded-lg cursor-not-allowed"><i class="fa-solid fa-lock mr-1"></i>Kunci</span>';
        }
        html += '</div></div>';
      });

      container.innerHTML = html;
    }

    function renderRecentActivity() {
      var container = document.getElementById('recentActivity');
      if (userProgress.length === 0) {
        container.innerHTML = '<p class="text-slate-400 text-center py-4">Belum ada aktivitas</p>';
        return;
      }
      var recent = userProgress.slice().sort(function(a, b) { return new Date(b.completed_at || b.created_at) - new Date(a.completed_at || a.created_at); }).slice(0, 5);
      var html = '';
      recent.forEach(function(p) {
        var label = fasalMap[p.fasal_id] || p.fasal_id;
        var date = new Date(p.completed_at || p.created_at).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
        html += '<div class="flex items-center justify-between p-3 bg-slate-50 rounded-lg mb-2">';
        html += '<div class="flex items-center gap-3">';
        html += '<div class="w-8 h-8 rounded-full flex items-center justify-center ' + (p.status === 'completed' ? 'bg-green-100 text-green-600' : 'bg-amber-100 text-amber-600') + '">';
        html += '<i class="fa-solid ' + (p.status === 'completed' ? 'fa-check' : 'fa-play') + ' text-sm"></i>';
        html += '</div>';
        html += '<div><div class="text-sm font-medium text-slate-700">' + label + '</div><div class="text-xs text-slate-400">' + date + '</div></div></div>';
        html += '<div class="text-right"><div class="text-sm font-bold ' + (p.status === 'completed' ? 'text-green-600' : 'text-amber-600') + '">' + (p.quiz_score || 0) + '%</div></div>';
        html += '</div>';
      });
      container.innerHTML = html;
    }

    function handleLogout() {
      logout();
      window.location.href = 'auth.html';
    }
  </script>
</body>
</html>
